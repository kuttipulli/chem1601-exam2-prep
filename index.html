<script>
"use strict";
const EXAM_AT = new Date("2026-10-15T19:00:00-05:00");
const LS_KEY = "chem1601-exam2-prep-v1";
const MODS = DATA.modules;
const MOD = Object.fromEntries(MODS.map(m => [m.id, m]));
const BANK = DATA.bank;
const QB = Object.fromEntries(BANK.map(q => [q.id, q]));
const MOCK = DATA.mock;
const MQ = Object.fromEntries(MOCK.map(q => ["mock:" + q.n, q]));
const CATS = [["concept","Concept gap"],["method","Wrong method"],["math","Math / units"],["sigfig","Sig figs / format"],["misread","Misread"],["guess","Guessed"]];
const CATN = Object.fromEntries(CATS);
const LET = "ABCDEFGH";

/* ------------------------------------------------------------------ state */
function blank(){ return {v:1, updated:0, att:{}, plan:{}, cards:{}, mock:{u:0}}; }
let S = blank();
try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }
function touch(){ S.updated = Date.now(); saveLocal(); queueRemote(); }

function merge(a, b){
  const out = blank();
  out.updated = Math.max(a.updated || 0, b.updated || 0);
  const ids = new Set([...Object.keys(a.att || {}), ...Object.keys(b.att || {})]);
  ids.forEach(id => {
    const all = [...((a.att || {})[id] || []), ...((b.att || {})[id] || [])];
    const seen = new Map(); all.forEach(x => seen.set(x.t, x));
    out.att[id] = [...seen.values()].sort((x, y) => x.t - y.t).slice(-8);
  });
  for (const k of ["plan", "cards"]) {
    const keys = new Set([...Object.keys(a[k] || {}), ...Object.keys(b[k] || {})]);
    keys.forEach(id => { const x = (a[k] || {})[id], y = (b[k] || {})[id]; out[k][id] = !x ? y : !y ? x : (x.t >= y.t ? x : y); });
  }
  out.mock = ((a.mock || {}).u || 0) >= ((b.mock || {}).u || 0) ? (a.mock || {u:0}) : b.mock;
  return out;
}

/* remote sync: claude db (owner only); localStorage always */
let dbRef = null, writing = false, pending = false, flushTimer = null, syncState = "This device";
async function initSync(){
  try {
    if (!window.claude || !window.claude.use) return;
    const user = await window.claude.use("user");
    const db = await window.claude.use("db");
    if (!db || !user) return;
    if (!(await user.isOwner())) return;
    dbRef = db.doc("progress/main");
    dbRef.onSnapshot(snap => {
      if (snap.exists) {
        const remote = snap.data();
        if (remote && remote.updated !== S.updated) {
          S = merge(S, remote); saveLocal(); render();
          if (S.updated !== remote.updated) { pending = true; scheduleFlush(); }
        }
      } else if (S.updated) { pending = true; scheduleFlush(); }
      syncState = "Synced"; stat();
    }, () => { dbRef = null; syncState = "This device"; stat(); });
  } catch (e) {}
}
function queueRemote(){ if (!dbRef) return; pending = true; scheduleFlush(); }
function scheduleFlush(){ clearTimeout(flushTimer); flushTimer = setTimeout(flush, 1500); }
async function flush(){
  if (!dbRef || writing || !pending) return;
  writing = true; pending = false;
  try { await dbRef.set(JSON.parse(JSON.stringify(S))); syncState = "Synced"; }
  catch (e) { if (e && e.code === "invalid_argument") { dbRef = null; syncState = "This device"; } else pending = true; }
  writing = false; stat();
  if (pending) scheduleFlush();
}

let ASK = null;
(async () => { try { if (window.claude && window.claude.use) { ASK = await window.claude.use("sample"); if (ASK) document.documentElement.classList.add("has-ask"); } } catch (e) {} })();

/* ------------------------------------------------------------------ helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const last = id => { const a = S.att[id]; return a && a.length ? a[a.length - 1] : null; };
const strip = h => { const d = document.createElement("div"); d.innerHTML = h; d.querySelectorAll("svg").forEach(s => s.replaceWith(" [diagram] ")); return d.textContent.replace(/\s+/g, " ").trim(); };
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const CONFIG = DATA.config || {};
function twinOpen(){ return !!CONFIG.twinsUnlocked || !!(S.plan["twin-unlock"] && S.plan["twin-unlock"].v); }
function avail(q){ return q.tag !== "twin" || twinOpen(); }
function modStats(mid){
  const qs = BANK.filter(q => q.mod === mid && avail(q)); let ok = 0, no = 0;
  const days = new Set();
  qs.forEach(q => { const l = last(q.id); if (l) (l.ok ? ok++ : no++); (S.att[q.id] || []).forEach(x => days.add(new Date(x.t).toDateString())); });
  return {n: qs.length || 1, ok, no, days: days.size};
}
/* mastery = right on the last try, across the whole topic; spacing = distinct days the topic was practiced (aim for 3) */
function mastery(s){ return !s.ok && !s.no ? "New" : (s.ok / s.n >= 0.8 && !s.no) ? "Solid" : "Learning"; }
function dots(days){ const k = Math.min(days, 3); return `<span class="dots" title="Practiced on ${days} day${days === 1 ? "" : "s"}; aim for 3 separate days" aria-label="Practiced on ${days} of 3 target days">${[0, 1, 2].map(i => `<i class="${i < k ? "on" : ""}"></i>`).join("")}</span>`; }
function mbar(s){ return `<span class="mt" aria-hidden="true"><i class="ok" style="width:${100 * s.ok / s.n}%"></i><i class="no" style="width:${100 * s.no / s.n}%"></i></span>`; }

/* ------------------------------------------------------------------ focus session (McGuire's intense study session: goal → focus → break → review)
   Kept per device in its own localStorage key, outside S, so the synced progress format doesn't change. */
const FKEY = LS_KEY + ":focus";
let F = null, FHIST = [], FGOAL = "", FMIN = 40, FMODE = false, FEND = false, FSETUP = false, STOPPED = null, WDOFF = "";
try { const o = JSON.parse(localStorage.getItem(FKEY) || "null"); if (o) { F = o.cur || null; FHIST = o.hist || []; FMIN = o.min || 40; } } catch (e) {}
try { FMODE = localStorage.getItem(LS_KEY + ":fmode") === "1"; WDOFF = localStorage.getItem(LS_KEY + ":wdoff") || ""; } catch (e) {}
if (F && Date.now() > F.t1 + 3 * 3600000) F = null;   // a session left running for hours is stale
function fSave(){ try { localStorage.setItem(FKEY, JSON.stringify({cur: F, hist: FHIST.slice(-40), min: FMIN})); } catch (e) {} }
function fmSave(){ try { localStorage.setItem(LS_KEY + ":fmode", FMODE ? "1" : "0"); } catch (e) {} }
function fLeft(){ return F ? F.t1 - Date.now() : 0; }
function fPct(){ if (!F) return 0; if (F.phase === "over") return 100; return Math.max(0, Math.min(100, 100 * (Date.now() - F.t0) / (F.t1 - F.t0))); }
function blocksToday(){ const d = new Date().toDateString(); return FHIST.filter(x => new Date(x.t).toDateString() === d).length; }
function fStart(goal, mins){ const now = Date.now(); F = {phase: "focus", goal: (goal || "").trim() || "Practice with full focus", mins, t0: now, t1: now + mins * 60000, log: []}; FEND = false; FMODE = true; fSave(); fmSave(); }
function fLog(id, ok){ if (F && (F.phase === "focus" || F.phase === "over")) { F.log.push({id, ok}); fSave(); } }
function routeGoal(b){ return b.go === "diag" ? "Finish the Diagnostic 20" : blockGoal(b); }

/* ------------------------------------------------------------------ lewis renderer */
function lewis(spec){
  const U = 46, pad = 30;
  const A = spec.a.map(a => ({el:a[0], x:a[1], y:a[2], lp:a[3], fc:a[4], bonds:[]}));
  spec.b.forEach(([i, j, o]) => {
    const ang = Math.atan2(A[j].y - A[i].y, A[j].x - A[i].x) * 180 / Math.PI;
    A[i].bonds.push(ang); A[j].bonds.push(ang + 180);
  });
  const xs = A.map(a => a.x), ys = A.map(a => a.y);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  let W = (maxx - minx) * U + pad * 2, H = (maxy - miny) * U + pad * 2;
  const bx = spec.ch ? 16 : 0;
  const X = a => (a.x - minx) * U + pad + bx, Y = a => (maxy - a.y) * U + pad;
  W += bx * 2 + (spec.ch ? 14 : 0);
  const norm = d => ((d % 360) + 360) % 360;
  const dist = (p, q) => { const d = Math.abs(norm(p) - norm(q)); return Math.min(d, 360 - d); };
  const rx = a => a.el === "" ? 0 : 4 + 5.2 * a.el.replace(/\d/g, "").length + 2 * (a.el.match(/\d/g) || []).length;
  const ry = a => a.el === "" ? 0 : 10;
  const trim = (a, deg) => { const r1 = rx(a), r2 = ry(a); if (!r1) return 0; const t = deg * Math.PI / 180; return 1 / Math.sqrt((Math.cos(t) / r1) ** 2 + (Math.sin(t) / r2) ** 2); };
  let out = "";
  spec.b.forEach(([i, j, o]) => {
    const a = A[i], b = A[j];
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    const deg = ang * 180 / Math.PI;
    const t1 = trim(a, deg) + (a.el ? 2 : 0), t2 = trim(b, deg + 180) + (b.el ? 2 : 0);
    const x1 = X(a) + Math.cos(ang) * t1, y1 = Y(a) - Math.sin(ang) * t1;
    const x2 = X(b) - Math.cos(ang) * t2, y2 = Y(b) + Math.sin(ang) * t2;
    const nx = Math.sin(ang), ny = Math.cos(ang);
    const ln = (off, cls) => `<line ${cls ? `class="${cls}"` : ""} x1="${(x1 + nx * off).toFixed(1)}" y1="${(y1 + ny * off).toFixed(1)}" x2="${(x2 + nx * off).toFixed(1)}" y2="${(y2 + ny * off).toFixed(1)}"/>`;
    if (o === 1) out += ln(0);
    else if (o === 2) out += ln(-3.2) + ln(3.2);
    else if (o === 3) out += ln(-4.8) + ln(0) + ln(4.8);
    else out += ln(-2.6) + ln(2.6, "dash");
  });
  A.forEach(a => {
    if (a.el) {
      const parts = a.el.match(/[A-Za-z]+|\d+/g) || [];
      let tx = "";
      parts.forEach(p => { tx += /\d/.test(p) ? `<tspan font-size="11" dy="4">${p}</tspan><tspan dy="-4"></tspan>` : `<tspan>${p}</tspan>`; });
      out += `<text x="${X(a).toFixed(1)}" y="${(Y(a) + 0.5).toFixed(1)}" text-anchor="middle" dominant-baseline="central">${tx}</text>`;
    }
    let lps = [];
    if (Array.isArray(a.lp)) lps = a.lp.slice();
    else if (a.lp > 0) {
      const n = a.lp;
      if (a.bonds.length === 1) {
        const o = a.bonds[0] + 180;
        lps = n === 1 ? [o] : n === 2 ? [o - 60, o + 60] : n === 3 ? [o, o - 90, o + 90] : [o, o - 90, o + 90, o + 180];
      } else if (a.bonds.length === 0) lps = [90, 270, 0, 180].slice(0, n);
      else {
        const taken = a.bonds.slice();
        for (let k = 0; k < n; k++) {
          let best = 0, bd = -1;
          for (let c = 0; c < 360; c += 15) {
            const md = Math.min(...taken.map(t => dist(t, c)));
            const bonus = c % 90 === 0 ? 0.6 : c % 45 === 0 ? 0.3 : 0;
            if (md + bonus > bd) { bd = md + bonus; best = c; }
          }
          taken.push(best); lps.push(best);
        }
      }
    }
    lps.forEach(d => {
      const t = d * Math.PI / 180, r = (a.el ? trim(a, d) : 0) + 5.5;
      const cx = X(a) + Math.cos(t) * r, cy = Y(a) - Math.sin(t) * r;
      const px = Math.sin(t) * 3.4, py = Math.cos(t) * 3.4;
      out += `<circle cx="${(cx + px).toFixed(1)}" cy="${(cy + py).toFixed(1)}" r="2.1"/><circle cx="${(cx - px).toFixed(1)}" cy="${(cy - py).toFixed(1)}" r="2.1"/>`;
    });
    if (a.fc && a.fc !== 0) {
      const txt = typeof a.fc === "number" ? (a.fc > 0 ? (a.fc === 1 ? "+" : a.fc + "+") : (a.fc === -1 ? "−" : (-a.fc) + "−")) : a.fc;
      const occ = a.bonds.concat(lps);
      let best = 45, bd = -1;
      [45, 135, 315, 225, 90, 0, 180, 270].forEach(c => { const md = occ.length ? Math.min(...occ.map(t => dist(t, c))) : 180; if (md > bd + 1) { bd = md; best = c; } });
      const t = best * Math.PI / 180, r = trim(a, best) + (String(txt).length > 1 ? 15 : 11);
      const fx = (X(a) + Math.cos(t) * r).toFixed(1), fy = (Y(a) - Math.sin(t) * r).toFixed(1);
      if (String(txt).length === 1) out += `<circle class="fcr" cx="${fx}" cy="${fy}" r="6.4"/>`;
      out += `<text class="fc" x="${fx}" y="${fy}" text-anchor="middle" dominant-baseline="central">${txt}</text>`;
    }
  });
  if (spec.ch) {
    const l = 8, r = W - 22, tp = 8, bt = H - 8;
    out += `<path d="M${l + 6} ${tp} H${l} V${bt} H${l + 6}"/><path d="M${r - 6} ${tp} H${r} V${bt} H${r - 6}"/>`;
    out += `<text class="ch" x="${r + 4}" y="${tp + 6}">${spec.ch}</text>`;
  }
  return `<svg class="lw" viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" width="${W.toFixed(0)}" height="${H.toFixed(0)}" role="img" aria-label="structure">${out}</svg>`;
}

/* ------------------------------------------------------------------ numbers */
function sigfigs(m){
  let s = m.replace(/^[+-]/, "");
  if (s.includes(".")) { s = s.replace(".", "").replace(/^0+/, ""); const n = Math.max(s.length, 1); return {min: n, max: n}; }
  s = s.replace(/^0+/, "");
  return {min: Math.max(s.replace(/0+$/, "").length, 1), max: Math.max(s.length, 1)};
}
function parseNum(raw){
  let s = String(raw).trim().replace(/[\s,]/g, "").replace(/[−–]/g, "-").replace(/[×*·]/g, "x").replace(/X/g, "x");
  if (!s) return null;
  let m = s.match(/^([+-]?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if (m) return {v: parseFloat(m[1]) / parseFloat(m[2]), sf: null};
  m = s.match(/^([+-]?(?:\d+\.?\d*|\.\d+))x10\^?\(?([+-]?\d+)\)?$/i);
  if (m) return {v: parseFloat(m[1]) * Math.pow(10, parseInt(m[2])), sf: sigfigs(m[1])};
  m = s.match(/^([+-]?(?:\d+\.?\d*|\.\d+))e([+-]?\d+)$/i);
  if (m) return {v: parseFloat(m[1] + "e" + m[2]), sf: sigfigs(m[1])};
  m = s.match(/^[+-]?(?:\d+\.?\d*|\.\d+)$/);
  if (m) return {v: parseFloat(s), sf: sigfigs(s)};
  return null;
}
function checkNum(q, raw){
  const p = parseNum(raw);
  if (!p) return {bad: true};
  const tol = q.tol || 0;
  const okv = tol === 0 ? Math.abs(p.v - q.ans) < 1e-9 * Math.max(1, Math.abs(q.ans)) : Math.abs(p.v - q.ans) <= tol * Math.abs(q.ans) + 1e-300;
  const sfok = !q.sf || p.sf === null || (q.sf >= p.sf.min && q.sf <= p.sf.max);
  const sfs = p.sf ? (p.sf.min === p.sf.max ? String(p.sf.min) : p.sf.min + "–" + p.sf.max) : "";
  return {okv, sfok, ok: okv && sfok, sf: sfs};
}
function fmtAns(q){
  if (q.kind !== "num") return "";
  const a = q.ans;
  if (Number.isInteger(a) && (q.tol === 0 || Math.abs(a) < 1e4)) return String(a);
  const ab = Math.abs(a);
  const sf = q.sf || 3;
  if (ab !== 0 && (ab < 0.01 || ab >= 10000)) { const [m, e] = a.toExponential(sf - 1).split("e"); return `${m.replace("-", "−")} × 10<sup>${e.replace("+", "").replace("-", "−")}</sup>`; }
  return (+a.toPrecision(sf)).toString().replace("-", "−");
}

function pick(mode, mods){

    let ids = [];
    Object.entries(per).forEach(([mid, k]) => { ids = ids.concat(shuffle(pool.filter(q => q.mod === mid && q.kind !== "self")).sort((a, b) => !!last(a.id) - !!last(b.id)).slice(0, k).map(q => q.id)); });
    return interleave(ids);

  if (mode === "mod") { pool = pool.filter(q => mods.includes(q.mod)); return interleave(pool.sort((a, b) => score(b) - score(a)).map(q => q.id)); }

  const n = mode === "mixed15" ? 15 : 10;

}
