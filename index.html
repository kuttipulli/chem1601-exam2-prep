<script>
const DATA = {"bank":[{"id":"L1","mod":"light","kind":"num","ans":4.08739670781893e-19,"sf":3,"unit":"J","stem":"Hydrogen's blue-green Balmer line has λ = 486 nm. What is the energy of <b>one<\/b> photon of this light?","sol":"<ol><li>Convert: 486 nm = 4.86 × 10<sup>−7<\/sup> m.<\/li><li>E = hc/λ = (6.626 × 10<sup>−34<\/sup> J·s)(2.998 × 10<sup>8<\/sup> m/s) / (4.86 × 10<sup>−7<\/sup> m)<\/li><li>E = <b>4.09 × 10<sup>−19<\/sup> J<\/b> per photon.<\/li><\/ol>","trap":"Plugging 486 straight in (forgetting nm → m) gives an answer 10⁹ times too small.","tol":0.01,"diff":2,"tag":""},{"id":"L2","mod":"light","kind":"num","ans":246.14302974485597,"sf":3,"unit":"kJ/mol","stem":"Same 486 nm light: what is the energy of one <b>mole<\/b> of these photons, in kJ/mol?","sol":"<ol><li>One photon: 4.087 × 10<sup>−19<\/sup> J.<\/li><li>× 6.022 × 10<sup>23<\/sup> photons/mol = 246143.0 J/mol.<\/li><li>÷ 1000 → <b>246 kJ/mol<\/b>.<\/li><\/ol>","trap":"Per photon vs per mole: if the unit is kJ/mol you must multiply by N<sub>A<\/sub> and divide by 1000.","tol":0.01,"diff":2,"tag":""},{"id":"L3","mod":"light","kind":"num","ans":1.3390554967019972e+16,"sf":3,"unit":"photons/s","stem":"A green laser pointer (λ = 532 nm) has a power of 5.00 mW (1 W = 1 J/s). How many photons does it emit each second?","sol":"<ol><li>Energy per second = 5.00 mW = 5.00 × 10<sup>−3<\/sup> J/s.<\/li><li>Energy per photon = hc/λ = 3.734 × 10<sup>−19<\/sup> J.<\/li><li>Photons per second = (J/s) ÷ (J/photon) = <b>1.34 × 10<sup>16<\/sup> photons/s<\/b>.<\/li><\/ol>","trap":"The power (J/s) is NOT the number of photons. Divide by the energy of one photon.","tag":"","tol":0.01,"diff":2},{"id":"L4","mod":"light","kind":"mc","choices":["The 405 nm laser","The 650 nm laser","They emit the same number","It depends on the brightness, not the color"],"ans":1,"stem":"A violet laser (405 nm) and a red laser (650 nm) have the same power output. Which emits more photons per second?","sol":"Same J/s, but each red photon carries less energy (E = hc/λ, longer λ → smaller E). To deliver the same joules each second, the red laser must send <b>more<\/b> photons. Photons/s = power ÷ (hc/λ) ∝ λ.","trap":"'Stays the same' is the classic wrong answer. The bluer laser emits FEWER photons.","tag":"","tol":0.01,"sf":null,"unit":"","diff":2},{"id":"L5","mod":"light","kind":"mc","choices":["More electrons are ejected, each with the same maximum KE","The same number of electrons, each with more KE","More electrons, each with more KE","No change at all"],"ans":0,"stem":"Light above the threshold frequency hits a metal. You double the <b>intensity<\/b> (brightness) but keep the color the same. What happens?","sol":"Intensity = number of photons. One photon ejects one electron, so more photons → more electrons. The KE of each electron depends only on the photon energy (color): KE = hν − φ, unchanged.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"L6","mod":"light","kind":"multi","choices":["Microwave","Ultraviolet","Radio","X-ray","Infrared","Gamma ray"],"ans":[1,3,5],"stem":"Which kinds of electromagnetic radiation have a <b>shorter<\/b> wavelength than visible light? Select all that apply.","sol":"Long → short λ: radio > microwave > infrared > <i>visible<\/i> > ultraviolet > X-ray > gamma. Shorter than visible: <b>UV, X-ray, gamma<\/b>.","trap":"A common slip: putting visible light on the wrong side of infrared. Memorize the order once.","tag":"","tol":0.01,"sf":null,"unit":"","diff":2},{"id":"L7","mod":"light","kind":"num","ans":3.201582666666666e-19,"sf":3,"unit":"J","stem":"A metal has a binding energy (work function) φ = 3.42 × 10<sup>−19<\/sup> J. Light of λ = 300. nm hits it. What is the maximum kinetic energy of an ejected electron?","sol":"<ol><li>E<sub>photon<\/sub> = hc/λ = 6.622 × 10<sup>−19<\/sup> J.<\/li><li>KE = E<sub>photon<\/sub> − φ = 6.622 × 10<sup>−19<\/sup> − 3.42 × 10<sup>−19<\/sup> = <b>3.20 × 10<sup>−19<\/sup> J<\/b>.<\/li><\/ol>","tol":0.01,"diff":2,"tag":"","trap":""},{"id":"L8","mod":"light","kind":"num","ans":838213.4706466347,"sf":3,"unit":"m/s","stem":"Continuing: the ejected electron has KE = 3.20 × 10<sup>−19<\/sup> J. What is its speed? (m<sub>e<\/sub> = 9.109 × 10<sup>−31<\/sup> kg)","sol":"<ol><li>KE = ½mv² → v = √(2·KE / m).<\/li><li>v = √(2 × 3.20 × 10<sup>−19<\/sup> J / 9.109 × 10<sup>−31<\/sup> kg)<\/li><li>v = <b>8.38 × 10<sup>5<\/sup> m/s<\/b>.<\/li><\/ol>","trap":"The data sheet lists the electron mass in GRAMS (9.109 × 10<sup>−28<\/sup> g). Convert to kg or your speed is off by √1000.","tol":0.01,"diff":2,"tag":""},{"id":"L9","mod":"light","kind":"num","ans":868.0339489570886,"sf":3,"unit":"pm","tol":0.012,"stem":"Using your rounded speed from the last part (8.38 × 10<sup>5<\/sup> m/s), what is the de Broglie wavelength of that electron, in pm?","sol":"<ol><li>λ = h / (mv) = 6.626 × 10<sup>−34<\/sup> / (9.109 × 10<sup>−31<\/sup> × 8.38 × 10<sup>5<\/sup>)<\/li><li>λ = 8.680 × 10<sup>−10<\/sup> m<\/li><li>× 10¹² pm/m → <b>868 pm<\/b>.<\/li><\/ol>","trap":"When a question says 'using your answer from the last part', use the value you REPORTED. Carrying the unrounded value can land a few pm off the key.","tag":"","diff":2},{"id":"L10","mod":"light","kind":"num","ans":1.1424137931034484e-34,"sf":3,"unit":"m","stem":"A 0.145 kg baseball travels at 40.0 m/s. What is its de Broglie wavelength?","sol":"λ = h/(mv) = 6.626 × 10<sup>−34<\/sup> / (0.145 × 40.0) = <b>1.14 × 10<sup>−34<\/sup> m<\/b>. That is far smaller than any atom, which is why you never see a baseball diffract.","tol":0.01,"diff":2,"tag":"","trap":""},{"id":"L11","mod":"light","kind":"mc","choices":["The electron","The proton","They move at the same speed","Can't tell without the wavelength value"],"ans":0,"stem":"An electron and a proton have the <b>same<\/b> de Broglie wavelength. Which is moving faster?","sol":"λ = h/(mv). Same λ means the same momentum mv. The electron's mass is about 1836× smaller, so its speed must be about 1836× larger.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"L12","mod":"light","kind":"num","ans":290.9649796904161,"sf":3,"unit":"pm","stem":"What is the de Broglie wavelength, in pm, of an electron moving at 2.50 × 10<sup>6<\/sup> m/s?","sol":"λ = h/(mv) = 6.626 × 10<sup>−34<\/sup> / (9.109 × 10<sup>−31<\/sup> kg × 2.50 × 10<sup>6<\/sup> m/s) = 2.910 × 10<sup>−10<\/sup> m = <b>291 pm<\/b>.","tol":0.01,"diff":2,"tag":"","trap":""},{"id":"L13","mod":"light","kind":"mc","choices":["Above the threshold, brighter light gives faster electrons","Below the threshold, very bright light eventually ejects electrons","Each photon's energy depends on its frequency, and one photon can eject at most one electron","The kinetic energy of ejected electrons is independent of the light's frequency"],"ans":2,"stem":"Which statement about the photoelectric effect is correct?","sol":"E = hν per photon; one photon interacts with one electron. Brightness changes how many photons arrive, never the energy of each one. Below threshold, no electrons come out no matter how bright.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"L14","mod":"light","kind":"num","ans":591.212738095238,"sf":3,"unit":"nm","stem":"A metal's work function is 3.36 × 10<sup>−19<\/sup> J. What is the <b>longest<\/b> wavelength of light (in nm) that can eject an electron?","sol":"Threshold: E<sub>photon<\/sub> = φ. λ<sub>max<\/sub> = hc/φ = (1.986 × 10<sup>−25<\/sup> J·m) / 3.36 × 10<sup>−19<\/sup> J = 5.912 × 10<sup>−7<\/sup> m = <b>591 nm<\/b>. Longer λ → less energy → no ejection.","tol":0.01,"diff":2,"tag":"","trap":""},{"id":"B1","mod":"bohr","kind":"num","ans":656.0834201834862,"sf":3,"unit":"nm","stem":"An electron in a hydrogen atom drops from n = 3 to n = 2. What wavelength of light (in nm) is emitted?","sol":"<ol><li>ΔE = −2.18 × 10<sup>−18<\/sup> J (1/2² − 1/3²) = −3.028 × 10<sup>−19<\/sup> J (negative: emission).<\/li><li>E<sub>light<\/sub> = −ΔE = 3.028 × 10<sup>−19<\/sup> J.<\/li><li>λ = hc/E = <b>656 nm<\/b> (red, the H-alpha line).<\/li><\/ol>","tol":0.01,"diff":2,"tag":"","trap":""},{"id":"B2","mod":"bohr","kind":"num","ans":102.51303440366972,"sf":3,"unit":"nm","stem":"What wavelength (nm) must a hydrogen atom <b>absorb<\/b> to move its electron from n = 1 to n = 3?","sol":"<ol><li>ΔE = −2.18 × 10<sup>−18<\/sup>(1/3² − 1/1²) = 1.938 × 10<sup>−18<\/sup> J (positive: absorption).<\/li><li>E<sub>light<\/sub> = ΔE.<\/li><li>λ = hc/ΔE = <b>103 nm<\/b> (ultraviolet).<\/li><\/ol>","tol":0.01,"diff":2,"tag":"","trap":""},{"id":"B3","mod":"bohr","kind":"num","ans":2,"tol":0.0,"unit":"","stem":"An electron in hydrogen is in n = 5. It emits a photon with energy 4.578 × 10<sup>−19<\/sup> J. What is n<sub>f<\/sub>?","sol":"<ol><li>Emission: E<sub>light<\/sub> = −ΔE = +2.18 × 10<sup>−18<\/sup> J (1/n<sub>f<\/sub>² − 1/5²).<\/li><li>4.578 × 10<sup>−19<\/sup> / 2.18 × 10<sup>−18<\/sup> = 0.2100 = 1/n<sub>f<\/sub>² − 0.0400<\/li><li>1/n<sub>f<\/sub>² = 0.2500 → n<sub>f<\/sub> = <b>2<\/b>.<\/li><\/ol>","trap":"Using E<sub>light<\/sub> = ΔE for an emission gives an impossible result here (1/n<sub>f<\/sub>² comes out negative); on the slide's example it gave a non-integer n (8.48). For emission, E<sub>light<\/sub> = −ΔE.","sf":null,"diff":2,"tag":""},{"id":"B4","mod":"bohr","kind":"mc","choices":["ΔE > 0 and E<sub>light<\/sub> = ΔE","ΔE < 0 and E<sub>light<\/sub> = −ΔE","ΔE < 0 and E<sub>light<\/sub> = ΔE","ΔE > 0 and E<sub>light<\/sub> = −ΔE"],"ans":1,"stem":"For an electron that <b>emits<\/b> a photon (n<sub>f<\/sub> &lt; n<sub>i<\/sub>), which is true?","sol":"The atom loses energy, so ΔE<sub>atom<\/sub> = E<sub>f<\/sub> − E<sub>i<\/sub> is negative. Photon energy is always positive, so E<sub>light<\/sub> = −ΔE.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"B5","mod":"bohr","kind":"num","ans":5251.184,"sf":3,"unit":"kJ/mol","stem":"Calculate the ionization energy of He<sup>+<\/sup> from its ground state (n = 1), in kJ/mol.","sol":"<ol><li>One-electron ion: E<sub>n<\/sub> = −2.18 × 10<sup>−18<\/sup> J · Z²/n², Z = 2.<\/li><li>Ionize = go to n = ∞ (E = 0): IE = +2.18 × 10<sup>−18<\/sup> × 4 / 1 = 8.72 × 10<sup>−18<\/sup> J per ion.<\/li><li>× N<sub>A<\/sub> ÷ 1000 = <b>5.25e+03 kJ/mol<\/b>.<\/li><\/ol>","trap":"Forgetting Z² gives the hydrogen value (1.31 × 10³ kJ/mol), 4× too small.","tol":0.01,"diff":2,"tag":""},{"id":"B6","mod":"bohr","kind":"num","ans":13.499658851512063,"sf":3,"unit":"nm","stem":"An electron in Li<sup>2+<\/sup> drops from n = 2 to n = 1. What is the wavelength of the emitted photon, in nm?","sol":"<ol><li>ΔE = −2.18 × 10<sup>−18<\/sup> × 3² (1/1² − 1/2²) = −1.471 × 10<sup>−17<\/sup> J.<\/li><li>E<sub>light<\/sub> = 1.471 × 10<sup>−17<\/sup> J.<\/li><li>λ = hc/E = <b>13.5 nm<\/b> (X-ray/far UV).<\/li><\/ol>","tol":0.01,"diff":2,"tag":"","trap":""},{"id":"B7","mod":"bohr","kind":"mc","choices":["n = 2 → n = 1","n = 3 → n = 1","n = 4 → n = 3","n = 5 → n = 4","n = 4 → n = 5"],"ans":3,"stem":"Which hydrogen-atom transition <b>emits<\/b> a photon with the longest wavelength?","sol":"Longest λ = smallest energy gap. Levels get closer together as n increases, so 5 → 4 has the smallest gap. (4 → 5 is an absorption, not an emission.)","trap":"Watch the direction of the arrow. Going up in n is absorption.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":""},{"id":"B8","mod":"bohr","kind":"mc","choices":["Get farther apart and approach −∞","Get closer together and approach 0","Stay evenly spaced","Get closer together and approach −2.18 × 10⁻¹⁸ J"],"ans":1,"stem":"As n increases in a hydrogen atom, the energy levels…","sol":"E<sub>n<\/sub> = −2.18 × 10<sup>−18<\/sup>/n². The values climb toward 0 (n = ∞, ionized) and the gaps shrink: ΔE(1→2) > ΔE(2→3) > ΔE(3→4)…","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"B9","mod":"bohr","kind":"num","ans":-1.3625e-19,"sf":3,"unit":"J","stem":"What is the energy of the n = 4 level of a hydrogen atom? (Include the sign.)","sol":"E<sub>4<\/sub> = −2.18 × 10<sup>−18<\/sup> J / 4² = <b>−1.36 × 10<sup>−19<\/sup> J<\/b>. Bound electrons always have negative energy.","tol":0.01,"diff":2,"tag":"","trap":""},{"id":"B10","mod":"bohr","kind":"num","ans":6,"tol":0.0,"stem":"An electron in hydrogen starts in n = 4 and can drop down by any combination of steps to n = 1. How many <b>different<\/b> photon energies could be emitted?","sol":"Count the distinct pairs of levels among 1, 2, 3, 4: 4→3, 4→2, 4→1, 3→2, 3→1, 2→1 = <b>6<\/b> (n(n−1)/2).","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"B11","mod":"bohr","kind":"mc","choices":["n<sub>f<\/sub> &gt; n<sub>i<\/sub> and ΔE is positive","n<sub>f<\/sub> &lt; n<sub>i<\/sub> and ΔE is negative","n<sub>f<\/sub> &gt; n<sub>i<\/sub> and ΔE is negative","The electron leaves the atom"],"ans":0,"stem":"A hydrogen atom <b>absorbs<\/b> a 410 nm photon. Which describes the electron?","sol":"Absorption raises the electron to a higher level (n<sub>f<\/sub> &gt; n<sub>i<\/sub>), so ΔE<sub>atom<\/sub> &gt; 0 and E<sub>light<\/sub> = ΔE. (410 nm is the 2 ↔ 6 line.)","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"B12","mod":"bohr","kind":"num","ans":5,"tol":0.0,"stem":"An electron in He<sup>+<\/sup> emits a photon of energy 6.20 × 10<sup>−19<\/sup> J and ends in n = 3. What was n<sub>i<\/sub>?","sol":"<ol><li>Emission, Z = 2: E<sub>light<\/sub> = +2.18 × 10<sup>−18<\/sup> × 4 (1/3² − 1/n<sub>i<\/sub>²).<\/li><li>6.20 × 10<sup>−19<\/sup> / 8.72 × 10<sup>−18<\/sup> = 0.0711 = 0.1111 − 1/n<sub>i<\/sub>²<\/li><li>1/n<sub>i<\/sub>² = 0.0400 → n<sub>i<\/sub> = <b>5<\/b>.<\/li><\/ol>","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"B13","mod":"bohr","kind":"mc","choices":["Each element has its own set of allowed electron energy levels","Atoms only absorb visible light","Electrons in atoms can have any energy","Brighter light changes the wavelengths emitted"],"ans":0,"stem":"Why does each element produce its own unique <b>line<\/b> spectrum instead of a continuous rainbow?","sol":"Electron energies are quantized. Only transitions between allowed levels happen, so only specific photon energies (specific λ) are emitted or absorbed, and the levels differ from element to element.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"B14","mod":"bohr","kind":"num","ans":4.844444444444444e-19,"sf":3,"unit":"J","stem":"What is the energy (J) of the photon emitted when an electron in hydrogen falls from n = 6 to n = 2?","sol":"E<sub>light<\/sub> = −ΔE = +2.18 × 10<sup>−18<\/sup>(1/2² − 1/6²) = 2.18 × 10<sup>−18<\/sup> × 0.2222 = <b>4.84 × 10<sup>−19<\/sup> J<\/b> (λ = 410 nm, violet).","tol":0.01,"diff":2,"tag":"","trap":""},{"id":"Q1","mod":"qm","kind":"mc","choices":["The uncertainty in its velocity must increase","The uncertainty in its velocity must also decrease","Its wavelength gets shorter","Nothing; better instruments can measure both exactly"],"ans":0,"stem":"If you measure an electron's <b>position<\/b> more precisely, what does Heisenberg's uncertainty principle say?","sol":"Δx·mΔv ≥ h/4π. Shrinking Δx forces Δv to grow. It is a fundamental limit of nature, not a limit of equipment, which is why fixed Bohr orbits (exact position and speed) can't be right.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"Q2","mod":"qm","kind":"mc","choices":["ψ","ψ²","1/ψ","The radial node count"],"ans":1,"stem":"Which quantity gives the probability density of finding an electron at a point?","sol":"ψ itself can be positive or negative. Max Born: ψ² is the probability density.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"Q3","mod":"qm","kind":"mc","choices":["0 radial, 2 angular","1 radial, 2 angular","2 radial, 1 angular","3 radial, 0 angular"],"ans":1,"stem":"How many radial and angular nodes does a <b>4d<\/b> orbital have?","sol":"Total nodes = n − 1 = 3. Angular = ℓ = 2 (d). Radial = n − ℓ − 1 = <b>1<\/b>. So 1 radial, 2 angular.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"Q4","mod":"qm","kind":"mc","choices":["3p","4s","4p","4d","5s"],"ans":2,"stem":"An orbital has 2 radial nodes and 1 angular node. Which orbital is it?","sol":"Angular nodes = ℓ = 1 → p. Total nodes = 3 = n − 1 → n = 4. It is <b>4p<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"Q5","mod":"qm","kind":"mc","choices":["3s","3p","3d","They penetrate equally"],"ans":0,"stem":"Which orbital in the n = 3 shell penetrates closest to the nucleus?","sol":"s orbitals have inner lobes (bumps in the radial probability) near the nucleus. Penetration: 3s &gt; 3p &gt; 3d, so energies 3s &lt; 3p &lt; 3d in a multielectron atom.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"Q6","mod":"qm","kind":"mc","choices":["At the nucleus and at each radial node","Only at the nucleus","Only far from the nucleus","Never"],"ans":0,"stem":"Where is the total radial probability of a 2s electron equal to zero?","sol":"Total radial probability = ψ² × (number of points at distance r). At r = 0 there are no points, so it is 0; at a radial node ψ = 0. A 2s orbital has one radial node.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"Q7","mod":"qm","kind":"mc","choices":["Electrons move in fixed circular orbits at exact distances","Electron energies are quantized","Orbitals describe where an electron is likely to be found","Electrons show wave-like behavior"],"ans":0,"stem":"Which idea is part of the Bohr model but <b>rejected<\/b> by quantum mechanics?","sol":"Fixed orbits would mean exact position and exact velocity at the same time, which Heisenberg forbids. Quantized energy survives; orbitals replace orbits.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"Q8","mod":"qm","kind":"mc","choices":["Constructive interference","Destructive interference","Diffraction","The photoelectric effect"],"ans":1,"stem":"Two waves meet exactly out of phase and cancel. What is this called?","sol":"Out of phase → amplitudes cancel → <b>destructive<\/b> interference. In phase → amplitudes add → constructive. Interference patterns (double slit) are evidence of wave behavior, for light AND for electrons.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"Q9","mod":"qm","kind":"num","ans":2,"tol":0.0,"stem":"How many radial nodes does a 3s orbital have?","sol":"Radial = n − ℓ − 1 = 3 − 0 − 1 = <b>2<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"N1","mod":"qn","kind":"mc","choices":["(2, 1, −1, −½)","(4, 3, −3, +½)","(3, 3, 0, +½)","(1, 0, 0, −½)","(5, 2, 2, +½)"],"ans":2,"stem":"Which set of quantum numbers (n, ℓ, m<sub>ℓ<\/sub>, m<sub>s<\/sub>) is <b>not<\/b> allowed?","sol":"ℓ can only go from 0 to n − 1. For n = 3, ℓ = 3 is impossible. Every other set obeys ℓ &lt; n and −ℓ ≤ m<sub>ℓ<\/sub> ≤ +ℓ.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"N2","mod":"qn","kind":"num","ans":16,"tol":0.0,"stem":"How many orbitals are in the n = 4 shell?","sol":"Orbitals per shell = n² = <b>16<\/b> (4s: 1, 4p: 3, 4d: 5, 4f: 7).","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"N3","mod":"qn","kind":"num","ans":10,"tol":0.0,"stem":"What is the maximum number of electrons with n = 3 and ℓ = 2?","sol":"ℓ = 2 is a d subshell: 2ℓ + 1 = 5 orbitals × 2 electrons = <b>10<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"N4","mod":"qn","kind":"num","ans":3,"tol":0.0,"stem":"How many orbitals have n = 5 and m<sub>ℓ<\/sub> = −2?","sol":"m<sub>ℓ<\/sub> = −2 needs ℓ ≥ 2. With n = 5, ℓ can be 2, 3, or 4 → <b>3<\/b> orbitals (one each in 5d, 5f, 5g).","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"N5","mod":"qn","kind":"num","ans":9,"tol":0.0,"stem":"In one atom, how many electrons can have n = 3 and m<sub>s<\/sub> = +½?","sol":"n = 3 has n² = 9 orbitals. Each orbital holds one +½ electron → <b>9<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"N6","mod":"qn","kind":"mc","choices":["4d","4f","3f","4p"],"ans":1,"stem":"Name the subshell with n = 4 and ℓ = 3.","sol":"ℓ = 0, 1, 2, 3 ↔ s, p, d, f. So n = 4, ℓ = 3 is <b>4f<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"N7","mod":"qn","kind":"mc","choices":["3d","4f","2d","5g"],"ans":2,"stem":"Which subshell does <b>not<\/b> exist?","sol":"2d would need ℓ = 2 with n = 2, but ℓ ≤ n − 1 = 1. (5g is fine: n = 5, ℓ = 4.)","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"N8","mod":"qn","kind":"num","ans":6,"tol":0.0,"stem":"How many orbitals have m<sub>ℓ<\/sub> = −1 and n ≤ 4?","sol":"Need ℓ ≥ 1. n = 2: ℓ = 1 (1 orbital). n = 3: ℓ = 1, 2 (2). n = 4: ℓ = 1, 2, 3 (3). Total <b>6<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"N9","mod":"qn","kind":"mc","choices":["(4, 1, −1, +½)","(4, 2, 0, +½)","(3, 1, 0, −½)","(4, 0, 1, +½)"],"ans":0,"stem":"Which set could describe the 4p electron of a ground-state gallium atom?","sol":"4p: n = 4, ℓ = 1, m<sub>ℓ<\/sub> ∈ {−1, 0, +1}. (4, 2, …) is 4d; (3, 1, …) is 3p; (4, 0, 1) breaks −ℓ ≤ m<sub>ℓ<\/sub> ≤ ℓ.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"N10","mod":"qn","kind":"mc","choices":["Size and energy","Shape","Orientation in space","Spin direction"],"ans":2,"stem":"What does the magnetic quantum number m<sub>ℓ<\/sub> describe?","sol":"n → size/energy, ℓ → shape, m<sub>ℓ<\/sub> → <b>orientation<\/b>, m<sub>s<\/sub> → spin (a property of the electron, not the orbital).","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"N11","mod":"qn","kind":"num","ans":32,"tol":0.0,"stem":"What is the maximum number of electrons in the n = 4 shell?","sol":"2n² = 2 × 16 = <b>32<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"Z1","mod":"zeff","kind":"num","ans":7,"tol":0.0,"stem":"Using the course model Z<sub>eff<\/sub> = Z − S, what Z<sub>eff<\/sub> does a valence (n = 3) electron of chlorine feel?","sol":"Cl: Z = 17, 1s<sup>2<\/sup> 2s<sup>2<\/sup> 2p<sup>6<\/sup> 3s<sup>2<\/sup> 3p<sup>5<\/sup>. Shielding electrons are those in LOWER n: n = 1 and 2 → S = 10. Z<sub>eff<\/sub> = 17 − 10 = <b>7<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"Z2","mod":"zeff","kind":"num","ans":1,"tol":0.0,"stem":"What Z<sub>eff<\/sub> does the 4s electron of potassium feel (Z<sub>eff<\/sub> = Z − S)?","sol":"K: Z = 19, [Ar]4s¹. All 18 electrons of n = 1–3 shield. Z<sub>eff<\/sub> = 19 − 18 = <b>1<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"Z3","mod":"zeff","kind":"num","ans":3,"tol":0.0,"stem":"What Z<sub>eff<\/sub> does the 4p electron of gallium feel (Z<sub>eff<\/sub> = Z − S)?","sol":"Ga: Z = 31, [Ar]4s<sup>2<\/sup> 3d<sup>10<\/sup> 4p<sup>1<\/sup>. Lower-n electrons: 1s–3p (18) + 3d¹⁰ (n = 3) = 28. The 4s² are the SAME n, so they don't count. Z<sub>eff<\/sub> = 31 − 28 = <b>3<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"Z4","mod":"zeff","kind":"num","ans":2,"tol":0.0,"stem":"What Z<sub>eff<\/sub> does a 4s electron of scandium feel (Z<sub>eff<\/sub> = Z − S)?","sol":"Sc: Z = 21, [Ar]4s<sup>2<\/sup> 3d<sup>1<\/sup>. Electrons with lower n than 4: the 18 of [Ar] plus the 3d¹ (n = 3) → S = 19. Z<sub>eff<\/sub> = 21 − 19 = <b>2<\/b>. Note: Sc has only 18 CORE electrons, but 19 SHIELDING electrons for its 4s. The slides warn these aren't always the same.","trap":"Subtracting only the core (18) gives 3. For the 4s electron, the 3d electron is closer to the nucleus (lower n), so it shields.","sf":null,"unit":"","diff":2,"tag":""},{"id":"Z5","mod":"zeff","kind":"mc","choices":["F⁻ (7) &lt; Ne (8) &lt; Na⁺ (9)","F⁻ (9) &gt; Ne (8) &gt; Na⁺ (7)","All three are 8","F⁻ (7) &gt; Ne (8) &gt; Na⁺ (9)"],"ans":0,"stem":"F⁻, Ne, and Na⁺ all have 1s<sup>2<\/sup> 2s<sup>2<\/sup> 2p<sup>6<\/sup>. Rank the Z<sub>eff<\/sub> on their 2p electrons (Z − S).","sol":"S = 2 (the 1s pair) for all three. Z<sub>eff<\/sub>: F⁻ 9 − 2 = 7, Ne 10 − 2 = 8, Na⁺ 11 − 2 = 9. More protons, same shielding → stronger pull → smaller radius: F⁻ &gt; Ne &gt; Na⁺ in size.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"Z6","mod":"zeff","kind":"mc","choices":["The 2s electron penetrates closer to the nucleus and feels a larger Z<sub>eff<\/sub>","The 2s orbital is larger","2p electrons are shielded less","2s has more nodes so it has less energy"],"ans":0,"stem":"In lithium, why is the 2s orbital lower in energy than 2p?","sol":"The 2s radial probability has a small inner bump inside the 1s region. While there it is barely shielded, so on average it feels a larger Z<sub>eff<\/sub> → lower energy. Same shell, smaller ℓ → lower energy.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"Z7","mod":"zeff","kind":"mc","choices":["Atom Y","Atom X","They are equal","Need the atomic numbers"],"ans":0,"stem":"Atom X's valence electron feels Z<sub>eff<\/sub> = 3+ at an average 150 pm. Atom Y's feels Z<sub>eff<\/sub> = 2+ at 90 pm. Using Coulomb's law, which atom has the higher first ionization energy?","sol":"PE ∝ (Z<sub>eff<\/sub>)(−1)/d. X: −3/150 = −0.0200 k. Y: −2/90 = −0.0222 k. Y's electron sits lower (more negative), so it takes more energy to remove: <b>Y<\/b> has the higher IE.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"Z8","mod":"zeff","kind":"mc","choices":["Z<sub>eff<\/sub> rises (one more proton, same inner shielding) while n stays the same","Electrons are added to a new shell","Shielding increases faster than nuclear charge","Atoms gain neutrons"],"ans":0,"stem":"Why do atoms get smaller going left to right across a period?","sol":"Each step adds a proton and an electron in the SAME shell. Same-shell electrons barely shield each other, so Z<sub>eff<\/sub> on the outer electrons rises and pulls them closer.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"C1","mod":"config","kind":"mc","choices":["[Ar]4s<sup>2<\/sup> 3d<sup>4<\/sup>","[Ar]4s<sup>1<\/sup> 3d<sup>5<\/sup>","[Ar]3d<sup>6<\/sup>","[Ar]4s<sup>2<\/sup> 4p<sup>4<\/sup>"],"ans":1,"stem":"What is the ground-state electron configuration of chromium?","sol":"Cr is an exception: moving one 4s electron into 3d makes a half-filled d⁵. <b>[Ar]4s<sup>1<\/sup> 3d<sup>5<\/sup><\/b>. Same idea: Mo, Cu, Ag.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"C2","mod":"config","kind":"mc","choices":["[Ar]4s<sup>1<\/sup> 3d<sup>9<\/sup>","[Ar]4s<sup>2<\/sup> 3d<sup>8<\/sup>","[Ar]3d<sup>10<\/sup>","[Ar]4s<sup>1<\/sup> 3d<sup>10<\/sup>"],"ans":2,"stem":"What is the electron configuration of Cu⁺?","sol":"Cu = [Ar]4s<sup>1<\/sup> 3d<sup>10<\/sup>. Cations lose the highest-n (4s) electron first → <b>[Ar]3d<sup>10<\/sup><\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"C3","mod":"config","kind":"mc","choices":["[Ar]4s<sup>2<\/sup> 3d<sup>3<\/sup>","[Ar]3d<sup>5<\/sup>","[Ar]4s<sup>1<\/sup> 3d<sup>4<\/sup>","[Ar]4s<sup>2<\/sup> 3d<sup>6<\/sup>"],"ans":1,"stem":"What is the electron configuration of Fe³⁺?","sol":"Fe = [Ar]4s<sup>2<\/sup> 3d<sup>6<\/sup>. Remove the two 4s electrons first, then one 3d → <b>[Ar]3d<sup>5<\/sup><\/b> (5 unpaired, paramagnetic).","trap":"Removing 3d electrons first ([Ar]4s<sup>2<\/sup> 3d<sup>3<\/sup>) is the #1 ion mistake. ns leaves before (n−1)d.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":""},{"id":"C4","mod":"config","kind":"mc","choices":["1s<sup>2<\/sup> 2s<sup>2<\/sup> 2p<sup>3<\/sup>","1s<sup>2<\/sup> 2s<sup>1<\/sup> 2p<sup>4<\/sup>","1s<sup>2<\/sup> 2s<sup>3<\/sup> 2p<sup>2<\/sup>","1s<sup>2<\/sup> 2s<sup>2<\/sup> 2d<sup>3<\/sup>"],"ans":1,"stem":"Which configuration is a valid <b>excited state<\/b> of nitrogen?","sol":"1s<sup>2<\/sup> 2s<sup>1<\/sup> 2p<sup>4<\/sup> has 7 electrons and breaks no rule, but it isn't the lowest energy: excited. 1s<sup>2<\/sup> 2s<sup>2<\/sup> 2p<sup>3<\/sup> is the ground state. 2s<sup>3<\/sup> breaks Pauli (max 2 per orbital). 2d doesn't exist.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"C5","mod":"config","kind":"num","ans":5,"tol":0.0,"stem":"How many unpaired electrons does Mn²⁺ have?","sol":"Mn = [Ar]4s<sup>2<\/sup> 3d<sup>5<\/sup> → Mn²⁺ = [Ar]3d<sup>5<\/sup>. Hund's rule: five d orbitals, one electron each → <b>5<\/b> unpaired.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"C6","mod":"config","kind":"mc","choices":["Cu²⁺","Fe²⁺","Zn","O","N"],"ans":2,"stem":"Which species is <b>diamagnetic<\/b>?","sol":"Zn = [Ar]4s<sup>2<\/sup> 3d<sup>10<\/sup>: every orbital full → all paired → diamagnetic. Cu²⁺ (d⁹), Fe²⁺ (d⁶), O (2p⁴), N (2p³) all have unpaired electrons.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"C7","mod":"config","kind":"mc","choices":["S²⁻","K⁺","Ca²⁺","Na⁺","Cl⁻"],"ans":3,"stem":"Which ion is <b>not<\/b> isoelectronic with argon?","sol":"Ar has 18 electrons. S²⁻ (16 + 2), Cl⁻ (17 + 1), K⁺ (19 − 1), Ca²⁺ (20 − 2) all have 18. Na⁺ has 10 (isoelectronic with Ne).","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"C8","mod":"config","kind":"num","ans":4,"tol":0.0,"stem":"Using the course definition, how many valence electrons does a lead (Pb) atom have?","sol":"Pb = [Xe]6s<sup>2<\/sup> 4f<sup>14<\/sup> 5d<sup>10<\/sup> 6p<sup>2<\/sup>. Main-group element: valence = outermost n (n = 6): 6s² 6p² → <b>4<\/b>. The filled 4f and 5d are core.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"C9","mod":"config","kind":"num","ans":3,"tol":0.0,"stem":"Using the course definition, how many valence electrons does scandium have?","sol":"Sc = [Ar]4s<sup>2<\/sup> 3d<sup>1<\/sup>. Transition metal: outermost n (4s²) + the unfilled d (3d¹) → <b>3<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"C10","mod":"config","kind":"mc","choices":["[Ar]4s<sup>2<\/sup> 3d<sup>10<\/sup>","[Ar]4s<sup>2<\/sup> 3d<sup>8<\/sup>","[Ar]3d<sup>10<\/sup>","[Ar]4s<sup>1<\/sup> 3d<sup>9<\/sup>"],"ans":2,"stem":"What is the configuration of Ga³⁺?","sol":"Ga = [Ar]4s<sup>2<\/sup> 3d<sup>10<\/sup> 4p<sup>1<\/sup>. Remove 4p¹, then 4s² (both n = 4) → <b>[Ar]3d<sup>10<\/sup><\/b>. (Ga⁺ = [Ar]4s<sup>2<\/sup> 3d<sup>10<\/sup>.)","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"C11","mod":"config","kind":"mc","choices":["[Kr]5s<sup>2<\/sup> 4d<sup>9<\/sup>","[Kr]5s<sup>1<\/sup> 4d<sup>10<\/sup>","[Kr]4d<sup>10<\/sup>","[Kr]5s<sup>2<\/sup> 4d<sup>10<\/sup>"],"ans":1,"stem":"What is the ground-state configuration of silver (Ag)?","sol":"Ag is one of the four exceptions (Cr, Mo, Cu, Ag): <b>[Kr]5s<sup>1<\/sup> 4d<sup>10<\/sup><\/b> fills the d subshell.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"C12","mod":"config","kind":"num","ans":16,"tol":0.0,"stem":"How many electrons in a ground-state selenium (Se) atom have ℓ = 1?","sol":"ℓ = 1 means p electrons. Se = 1s<sup>2<\/sup> 2s<sup>2<\/sup> 2p<sup>6<\/sup> 3s<sup>2<\/sup> 3p<sup>6<\/sup> 4s<sup>2<\/sup> 3d<sup>10<\/sup> 4p<sup>4<\/sup> → 2p⁶ + 3p⁶ + 4p⁴ = <b>16<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"C13","mod":"config","kind":"mc","choices":["Sn","Sb","Bi","As"],"ans":1,"stem":"Which element has the configuration [Kr]5s<sup>2<\/sup> 4d<sup>10<\/sup> 5p<sup>3<\/sup>?","sol":"Row 5, p-block, third p electron → group 15 → <b>Sb<\/b> (antimony).","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"C14","mod":"config","kind":"mc","choices":["Both have 2 unpaired 3d electrons","Ti has 2 unpaired 4s electrons","Ti²⁺ has 4 unpaired electrons","Neither has unpaired electrons"],"ans":0,"stem":"Titanium and Ti²⁺ are both paramagnetic. Why?","sol":"Ti = [Ar]4s<sup>2<\/sup> 3d<sup>2<\/sup>: the 4s pair is paired, the two 3d electrons are in separate orbitals (Hund). Ti²⁺ = [Ar]3d<sup>2<\/sup>: the 4s pair left first, the two unpaired 3d remain.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"C15","mod":"config","kind":"mc","choices":["Sc³⁺","Fe²⁺","Cu²⁺","Cr³⁺"],"ans":0,"stem":"Which ion has a noble-gas electron configuration?","sol":"Sc³⁺ = [Ar] exactly. The others keep d electrons: Fe²⁺ d⁶, Cu²⁺ d⁹, Cr³⁺ d³.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"C16","mod":"config","kind":"mc","choices":["[Kr]5s<sup>2<\/sup> 4d<sup>4<\/sup>","[Kr]5s<sup>1<\/sup> 4d<sup>5<\/sup>","[Kr]4d<sup>6<\/sup>","[Kr]5s<sup>2<\/sup> 5p<sup>4<\/sup>"],"ans":1,"stem":"What is the ground-state configuration of molybdenum (Mo)?","sol":"Mo sits under Cr and does the same thing: <b>[Kr]5s<sup>1<\/sup> 4d<sup>5<\/sup><\/b> (half-filled d).","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"T1","mod":"trends","kind":"mc","choices":["Si &lt; Al &lt; Mg &lt; Na","Na &lt; Mg &lt; Al &lt; Si","Mg &lt; Na &lt; Si &lt; Al","Al &lt; Si &lt; Na &lt; Mg"],"ans":0,"stem":"Arrange Na, Mg, Al, Si in order of <b>increasing<\/b> atomic radius.","sol":"Same row (n = 3); Z<sub>eff<\/sub> rises to the right, so radius shrinks to the right: <b>Si &lt; Al &lt; Mg &lt; Na<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"T2","mod":"trends","kind":"mc","choices":["Na &lt; Al &lt; Mg &lt; Si","Na &lt; Mg &lt; Al &lt; Si","Al &lt; Na &lt; Mg &lt; Si","Si &lt; Al &lt; Mg &lt; Na"],"ans":0,"stem":"Arrange Na, Mg, Al, Si in order of <b>increasing first ionization energy<\/b>.","sol":"General trend: up across the row. Exception: group 13 &lt; group 2, because Al's electron comes from a higher-energy 3p orbital while Mg's comes from 3s. So <b>Na &lt; Al &lt; Mg &lt; Si<\/b> (496, 578, 738, 786 kJ/mol).","trap":"Forgetting the column-13 &lt; column-2 exception gives Na &lt; Mg &lt; Al &lt; Si.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":""},{"id":"T3","mod":"trends","kind":"mc","choices":["Group 1","Group 2","Group 13","Group 15"],"ans":1,"stem":"An element's successive ionization energies (kJ/mol) are 738, 1451, 7733, 10540. Which group is it in?","sol":"The huge jump comes between IE₂ and IE₃: two electrons come off easily, the third comes from the core. Two valence electrons → <b>group 2<\/b> (this is Mg).","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"T4","mod":"trends","kind":"mc","choices":["Fe and S²⁻","Fe³⁺ and S","Fe and S","Fe³⁺ and S²⁻"],"ans":0,"stem":"Which is larger in each pair: Fe vs Fe³⁺, and S vs S²⁻?","sol":"Cations are smaller than their atoms (fewer electrons, same nuclear charge; often a whole shell gone). Anions are larger (added electron–electron repulsion). Larger: <b>Fe<\/b> and <b>S²⁻<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"T5","mod":"trends","kind":"mc","choices":["O²⁻ &gt; F⁻ &gt; Na⁺ &gt; Mg²⁺","Mg²⁺ &gt; Na⁺ &gt; F⁻ &gt; O²⁻","F⁻ &gt; O²⁻ &gt; Mg²⁺ &gt; Na⁺","All the same size"],"ans":0,"stem":"Rank the isoelectronic ions O²⁻, F⁻, Na⁺, Mg²⁺ from largest to smallest.","sol":"Same 10 electrons; more protons pull them in tighter. Protons: O 8, F 9, Na 11, Mg 12 → <b>O²⁻ &gt; F⁻ &gt; Na⁺ &gt; Mg²⁺<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"T6","mod":"trends","kind":"mc","choices":["N","C","O","F"],"ans":0,"stem":"Which element has a <b>less<\/b> favorable (less negative) electron affinity than the element just to its left?","sol":"EA exceptions: column 15 vs 14, column 2 vs 1, column 18 vs 17. N's new electron must pair up in a half-filled 2p set, so N's EA is less favorable than C's.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"T7","mod":"trends","kind":"mc","choices":["O's fourth 2p electron is paired, and electron–electron repulsion makes it easier to remove","N has a full octet","O's electron comes from a higher shell","O has fewer protons"],"ans":0,"stem":"Which explanation for <b>IE₁(O) &lt; IE₁(N)<\/b> is correct?","sol":"N: three unpaired 2p electrons. O: 2p⁴, one orbital holds a pair. The pair repel each other, so removing one costs less. Same n, similar Z<sub>eff<\/sub>, so pairing repulsion is the deciding factor.","trap":"'Stable half-filled shell' or 'octet' language is not the explanation graders want. Name the pairing repulsion.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":""},{"id":"T8","mod":"trends","kind":"mc","choices":["Cs","Ba","Bi","Sn"],"ans":0,"stem":"Which element has the most metallic character?","sol":"Metallic character increases down and to the left (easy to lose electrons). Cs is farthest down-left.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"T9","mod":"trends","kind":"mc","choices":["F &gt; O &gt; N &gt; C","C &gt; N &gt; O &gt; F","O &gt; F &gt; N &gt; C","N &gt; O &gt; F &gt; C"],"ans":0,"stem":"Rank C, N, O, F by electronegativity (highest first).","sol":"EN increases across a row toward F: <b>F &gt; O &gt; N &gt; C<\/b> (4.0, 3.5, 3.0, 2.5).","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"T10","mod":"trends","kind":"mc","choices":["Na","Mg","They are equal","Can't be compared"],"ans":0,"stem":"Which has the larger <b>second<\/b> ionization energy, Na or Mg?","sol":"Na⁺ is [Ne]: its second electron comes from the n = 2 core (very high Z<sub>eff<\/sub>, close to the nucleus). Mg⁺ still has a 3s valence electron. IE₂(Na) ≈ 4560 kJ/mol ≫ IE₂(Mg) ≈ 1450.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"T11","mod":"trends","kind":"mc","choices":["P &gt; S","S &gt; P","They are equal","S &gt; Cl"],"ans":0,"stem":"Which comparison of first ionization energy is correct?","sol":"Group 16 &lt; group 15 exception: S (3p⁴) has a paired electron that is easier to remove, so <b>IE₁(P) &gt; IE₁(S)<\/b>. Cl &gt; S follows the normal trend.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"T12","mod":"trends","kind":"mc","choices":["Moving down a group, the valence electron is in a higher n, farther from the nucleus","Moving down, Z<sub>eff<\/sub> drops sharply","Moving down, atoms lose protons","Moving down, electrons pair up"],"ans":0,"stem":"Why does IE₁ decrease going down a group?","sol":"Z<sub>eff<\/sub> stays roughly constant down a group, but n increases, so the valence electron is farther away and less tightly held (Coulomb: PE ∝ −Z<sub>eff<\/sub>/d).","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"T13","mod":"trends","kind":"mc","choices":["Electron affinity is an energy measured for an isolated atom gaining an electron; electronegativity describes an atom's pull on shared electrons in a bond","They are the same thing","Electronegativity has units of kJ/mol","Electron affinity only applies to metals"],"ans":0,"stem":"What is the difference between electron affinity and electronegativity?","sol":"EA: energy change when a gas-phase atom gains an electron (negative = released). EN: a unitless relative number (F = 4.0) for an atom's pull on bonding electrons. The slides warn: they are different.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"T14","mod":"trends","kind":"mc","choices":["Al","Si","Mg","Na"],"ans":0,"stem":"Successive IEs (kJ/mol): 577, 1816, 2744, 11577. Which third-row element is this?","sol":"Big jump after IE₃ → 3 valence electrons → group 13 → <b>Al<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"T15","mod":"trends","kind":"self","stem":"In one or two sentences, explain why the first ionization energy of boron is <b>lower<\/b> than that of beryllium.","model":"Boron's outermost electron is in a 2p orbital, which is higher in energy (and shielded more, penetrates less) than beryllium's 2s electron, so it takes less energy to remove even though B has one more proton.","rubric":["Names the subshell: B's electron is 2p, Be's is 2s","Says 2p is higher energy / penetrates less / more shielded","Concludes less energy needed to remove it"],"tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"P1","mod":"polarity","kind":"mc","choices":["Nonpolar covalent","Polar covalent","Ionic"],"ans":1,"stem":"Classify a C–O bond (EN: C 2.5, O 3.5) using the course cutoffs.","sol":"ΔX = 1.0. Course: 0 ≤ ΔX &lt; 0.5 nonpolar; 0.5 ≤ ΔX &lt; 2.0 polar covalent; ΔX ≥ 2.0 ionic. → <b>polar covalent<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"P2","mod":"polarity","kind":"mc","choices":["Nonpolar covalent","Polar covalent","Ionic"],"ans":2,"stem":"Classify the Na–Cl bond (EN: Na 0.9, Cl 3.0).","sol":"ΔX = 2.1 ≥ 2.0 → <b>ionic<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"P3","mod":"polarity","kind":"mc","choices":["Nonpolar covalent","Polar covalent","Ionic"],"ans":0,"stem":"Classify the C–H bond (EN: C 2.5, H 2.1) using the <b>course<\/b> cutoffs.","sol":"ΔX = 0.4 &lt; 0.5 → <b>nonpolar covalent<\/b> in this course.","trap":"Some books (OpenStax) use 0.4 as the polar cutoff and would call 0.4 polar. Your instructors use 0.5 and 2.0.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":""},{"id":"P4","mod":"polarity","kind":"mc","choices":["H–F","H–Cl","H–Br","H–I"],"ans":0,"stem":"Which bond is the most polar?","sol":"F is the most electronegative halogen, so ΔX is largest for <b>H–F<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"P5","mod":"polarity","kind":"mc","choices":["δ+ on H, δ− on Cl; arrow points to Cl","δ− on H, δ+ on Cl; arrow points to H","No partial charges","δ+ on both atoms"],"ans":0,"stem":"Which correctly describes the bond dipole in H–Cl?","sol":"Cl is more electronegative and pulls the shared pair toward itself: δ− on Cl, δ+ on H. The dipole arrow points toward the δ− end.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"P6","mod":"polarity","kind":"mc","choices":["Bond A","Bond B","Equal","Need the EN values"],"ans":0,"stem":"Bonds A and B carry the same partial charges (same q), but bond A is 1.5 times longer. Which has the larger dipole moment?","sol":"μ = q × r. Same q, larger r → larger μ. <b>Bond A<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"P7","mod":"polarity","kind":"mc","choices":["Decrease (it becomes twice as negative)","Increase","No change","It becomes positive"],"ans":0,"stem":"A Na⁺ ion and an O²⁻ ion sit a fixed distance apart. If Na⁺ is replaced by Ca²⁺ (same distance), how does the potential energy change? (A larger negative number counts as a decrease.)","sol":"PE = kQ₁Q₂/d. (+1)(−2) = −2 → (+2)(−2) = −4. The PE doubles in magnitude and is more negative → <b>decrease<\/b>.","trap":"More charge on oppositely charged ions = more negative PE = 'decrease'.","tag":"","tol":0.01,"sf":null,"unit":"","diff":2},{"id":"P8","mod":"polarity","kind":"mc","choices":["Increase (becomes positive: repulsion)","Decrease","No change","It becomes zero"],"ans":0,"stem":"A Ca²⁺ cation and an F⁻ anion are 230 pm apart. If F⁻ is replaced with a K⁺ cation at the same distance, how does the potential energy change?","sol":"(+2)(−1) = −2 (attractive, negative) → (+2)(+1) = +2 (repulsive, positive). Going from negative to positive is an <b>increase<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"P9","mod":"polarity","kind":"mc","choices":["MgO","NaCl","KBr","NaF"],"ans":0,"stem":"Assuming similar ion distances, which pair of ions has the strongest attraction (most negative Coulomb PE)?","sol":"Charge product dominates: MgO (+2)(−2) = −4 vs −1 for the others. MgO also has small ions. <b>MgO<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"P10","mod":"polarity","kind":"mc","choices":["An extended lattice of Mg²⁺ and Cl⁻ ions; MgCl₂ is just the ratio","Individual MgCl₂ molecules","Mg and Cl atoms sharing electrons equally","Mg²⁺ ions bonded to Cl₂ molecules"],"ans":0,"stem":"What does the formula MgCl₂ describe?","sol":"Ionic compounds have no molecules. MgCl₂ is an empirical formula: a 1 : 2 ratio of ions in a lattice, each ion attracted to all its neighbors.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"P11","mod":"polarity","kind":"mc","choices":["Polar covalent","Ionic","Nonpolar covalent"],"ans":0,"stem":"A bond has ΔX = 1.9. Classify it with the course cutoffs.","sol":"0.5 ≤ 1.9 &lt; 2.0 → <b>polar covalent<\/b>. The boundary is 2.0, not 1.8 or 1.7.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"P12","mod":"polarity","kind":"mc","choices":["Li–F, because its larger ΔX gives a larger charge separation","H–F","They have equal dipoles","Neither has a dipole"],"ans":0,"stem":"Which bond has the larger dipole moment, Li–F (ΔX 3.0) or H–F (ΔX 1.9)?","sol":"Bigger ΔX → more charge separation (bigger q). Li–F is also longer (larger r). μ = q·r is larger for <b>Li–F<\/b>. Even so, the electron is not 100% transferred.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"W1","mod":"lewis","kind":"num","ans":32,"tol":0.0,"stem":"How many valence electrons are in the sulfate ion, SO<sub>4<\/sub><sup>2−<\/sup>?","sol":"S 6 + 4 O × 6 = 30, + 2 for the 2− charge = <b>32<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"W2","mod":"lewis","kind":"num","ans":8,"tol":0.0,"stem":"How many valence electrons are in the ammonium ion, NH<sub>4<\/sub><sup>+<\/sup>?","sol":"N 5 + 4 H × 1 = 9, − 1 for the + charge = <b>8<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"W3","mod":"lewis","kind":"num","ans":2,"tol":0.0,"stem":"How many lone pairs are on the central Xe atom in XeF₄?","sol":"Total = 8 + 4 × 7 = 36 e⁻. Four Xe–F bonds use 8. Each F needs 3 lone pairs: 24. Left over: 36 − 32 = 4 e⁻ = <b>2 lone pairs<\/b> on Xe (an expanded octet: 12 e⁻ around Xe). <span class=\"lewis\" data-l=\"XeF4\"><\/span>","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"W4","mod":"lewis","kind":"mc","choices":["BF₃","NF₃","CF₄","SF₂"],"ans":0,"stem":"Which molecule has a central atom with an <b>incomplete<\/b> octet in its best Lewis structure?","sol":"B has only 3 valence electrons; BF₃ has 6 electrons around B. <span class=\"lewis\" data-l=\"BF3\"><\/span> (Be compounds do this too.)","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"W5","mod":"lewis","kind":"mc","choices":["PCl₅","NCl₅","OF₄","CH₅"],"ans":0,"stem":"Which molecule can exist with an expanded octet on its central atom?","sol":"Only period-3-and-below atoms (P, S, Cl, Xe…) expand. N, O, C (period 2) never exceed 8. <b>PCl₅<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"W6","mod":"lewis","kind":"mc","choices":["NO₂","CO₂","SO₂","O₃"],"ans":0,"stem":"Which species has an odd number of electrons (a radical)?","sol":"NO₂: 5 + 2 × 6 = <b>17<\/b>. Odd → one unpaired electron somewhere. CO₂ 16, SO₂ 18, O₃ 18.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"W7","mod":"lewis","kind":"mc","choices":["H bonded to an O, which is bonded to N (H–O–NO₂)","H bonded directly to N (H–NO₃)","H in the middle between O and N (O–H–NO₂)"],"ans":0,"stem":"Which skeleton is correct for nitric acid, HNO₃?","sol":"Oxyacids: H bonds to O, never to the central atom, and H can only make one bond. <span class=\"lewis\" data-l=\"HNO3_1\"><\/span> N is central with three O; one O carries the H.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"W8","mod":"lewis","kind":"num","ans":1,"tol":0.0,"stem":"How many lone pairs are in the Lewis structure of HCN?","sol":"10 valence e⁻: H–C≡N uses 8 in bonds; the last 2 are a lone pair on N → <b>1<\/b>. <span class=\"lewis\" data-l=\"HCN\"><\/span>","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"W9","mod":"lewis","kind":"num","ans":4,"tol":0.0,"stem":"How many lone pairs are in the Lewis structure of CO₂?","sol":"16 e⁻: O=C=O uses 8; each O gets 2 lone pairs → <b>4<\/b>. <span class=\"lewis\" data-l=\"CO2\"><\/span>","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"W10","mod":"lewis","kind":"num","ans":12,"tol":0.0,"stem":"How many electrons are used in <b>bonds<\/b> in C₂H₄ (ethene)?","sol":"12 valence e⁻ total. H₂C=CH₂: four C–H (8 e⁻) + one C=C (4 e⁻) = <b>12<\/b>, no lone pairs.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"W11","mod":"lewis","kind":"mc","choices":["S","O","Cl","Any of them"],"ans":0,"stem":"Which atom is central in thionyl chloride, SOCl₂?","sol":"Put the least electronegative atom (that isn't H) in the middle; halogens and O go outside. <b>S<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"W12","mod":"lewis","kind":"num","ans":34,"tol":0.0,"stem":"How many valence electrons are in XeO₂F₂?","sol":"Xe 8 + 2 O × 6 + 2 F × 7 = <b>34<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"W13","mod":"lewis","kind":"num","ans":2,"tol":0.0,"stem":"How many lone pairs are on the central Cl atom in ClF₃?","sol":"28 e⁻. Three Cl–F bonds use 6; three F × 3 lone pairs = 18; 28 − 24 = 4 → <b>2 lone pairs<\/b> on Cl (10 e⁻ around Cl, expanded octet). <span class=\"lewis\" data-l=\"ClF3\"><\/span>","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"W14","mod":"lewis","kind":"mc","choices":["H–O–Cl","H–Cl–O","Cl–H–O","O–H–Cl"],"ans":0,"stem":"Which skeleton is correct for hypochlorous acid, HClO?","sol":"Oxyacid rule: H on O. Hydrogen can only make one bond, so it can never be central. <b>H–O–Cl<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"W15","mod":"lewis","kind":"self","stem":"On paper, draw the best Lewis structure of ClF₃ and then of NH<sub>4<\/sub><sup>+<\/sup>. Count the electrons around each central atom.","model":"<span class=\"lewis\" data-l=\"ClF3\"><\/span> Cl has 3 bonds + 2 lone pairs = 10 e⁻ (expanded octet, fine for period 3). <span class=\"lewis\" data-l=\"NH4\"><\/span> N has 4 bonds, 8 e⁻, formal charge +1, brackets with + charge.","rubric":["ClF₃: 28 e⁻, each F has 3 lone pairs","Cl carries 2 lone pairs (10 e⁻ total)","NH₄⁺: 4 N–H bonds, no lone pairs, brackets + charge"],"tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"F1","mod":"fc","kind":"num","ans":1,"tol":0.0,"stem":"What is the formal charge on N in NH<sub>4<\/sub><sup>+<\/sup>?","sol":"FC = valence − nonbonding e⁻ − ½ bonding e⁻ = 5 − 0 − ½(8) = <b>+1<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"F2","mod":"fc","kind":"mc","choices":["C −1, O +1","C 0, O 0","C +1, O −1","C −2, O +2"],"ans":0,"stem":"In carbon monoxide, :C≡O:, what are the formal charges?","sol":"C: 4 − 2 − 3 = −1. O: 6 − 2 − 3 = +1. Sum = 0 ✓. <span class=\"lewis\" data-l=\"CO\"><\/span> (A rare case where the best structure puts − on the less EN atom, because it's the only way to complete both octets.)","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"F3","mod":"fc","kind":"mc","choices":["<span class=\"lewis\" data-l=\"OCN_a\"><\/span>","<span class=\"lewis\" data-l=\"OCN_b\"><\/span>","<span class=\"lewis\" data-l=\"OCN_c\"><\/span>"],"ans":1,"stem":"Which resonance contributor of the cyanate ion, OCN⁻, contributes the <b>most<\/b>?","sol":"All three complete octets. A puts −1 on N; B puts −1 on O; C puts +1 on O and −2 on N (worst). Smallest FCs, with the negative charge on the MOST electronegative atom (O) → <b>B<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"F4","mod":"fc","kind":"mc","choices":["<span class=\"lewis\" data-l=\"SCN_a\"><\/span>","<span class=\"lewis\" data-l=\"SCN_b\"><\/span>","<span class=\"lewis\" data-l=\"SCN_c\"><\/span>"],"ans":0,"stem":"Which contributor of the thiocyanate ion, SCN⁻, is best?","sol":"A has −1 on N; B has −1 on S; C has +1 on S and −2 on N. N (3.0) is more electronegative than S (2.5), so the negative charge belongs on N → <b>A<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"F5","mod":"fc","kind":"mc","choices":["N–N–O, because N–O–N would put a large positive formal charge on O","N–O–N, because O is in the middle of the formula","Both are equally good","N–O–N, because it is symmetric"],"ans":0,"stem":"Is nitrous oxide (N₂O) arranged N–N–O or N–O–N?","sol":"N–O–N's best structure (N=O=N) needs +2 on O, the most electronegative atom: terrible. <span class=\"lewis\" data-l=\"NON\"><\/span> N–N–O allows small FCs, with the negative charge on O. <span class=\"lewis\" data-l=\"N2O_b\"><\/span>","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"F6","mod":"fc","kind":"num","ans":0,"tol":0.0,"stem":"In the sulfate structure with two S=O double bonds and two S–O single bonds, what is the formal charge on S?","sol":"S has 6 bonds (12 bonding e⁻) and no lone pairs: FC = 6 − 0 − 6 = <b>0<\/b>. With all single bonds it would be +2. <span class=\"lewis\" data-l=\"SO4_2d\"><\/span>","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"F7","mod":"fc","kind":"mc","choices":["<span class=\"lewis\" data-l=\"SO4_2d\"><\/span>","<span class=\"lewis\" data-l=\"SO4_0d\"><\/span>"],"ans":0,"stem":"Following the course's 'minimize formal charge' approach, which sulfate Lewis structure is preferred?","sol":"S is in period 3, so it may expand its octet. Two double bonds give S a formal charge of 0 and keep the −1 charges on two O atoms. All-single bonds put +2 on S.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"F8","mod":"fc","kind":"mc","choices":["−1","0","+1","−2"],"ans":2,"stem":"An oxygen atom has 3 bonds and 1 lone pair. What is its formal charge?","sol":"6 − 2 − 3 = <b>+1<\/b>. Memorize O: 1 bond + 3 LP = −1; 2 bonds + 2 LP = 0; 3 bonds + 1 LP = +1.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"F9","mod":"fc","kind":"num","ans":-2,"tol":0.0,"stem":"What is the sum of all formal charges in the carbonate ion, CO<sub>3<\/sub><sup>2−<\/sup>?","sol":"The sum of formal charges always equals the overall charge: <b>−2<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"F10","mod":"fc","kind":"mc","choices":["Complete octets (where possible) → smallest formal charges → negative FC on the most electronegative atom","Most double bonds → symmetric → no lone pairs","Negative charge on the least electronegative atom","Fewest electrons around the central atom"],"ans":0,"stem":"What priorities does the course use to pick the best Lewis structure?","sol":"From the slides, in order of importance: complete octets!! → small or zero FCs → negative FCs on the most EN element. Also avoid like charges on neighboring atoms.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"F11","mod":"fc","kind":"num","ans":-1,"tol":0.0,"stem":"In the best structure of the cyanide ion, [:C≡N:]⁻, what is the formal charge on carbon?","sol":"C: 4 − 2 − 3 = <b>−1<\/b>; N: 5 − 2 − 3 = 0. Sum −1 ✓.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"F12","mod":"fc","kind":"mc","choices":["<span class=\"lewis\" data-l=\"N3_a\"><\/span>","<span class=\"lewis\" data-l=\"N3_b\"><\/span>","Both contribute equally"],"ans":0,"stem":"Azide, N₃⁻, has three important contributors. Which type contributes more: the symmetric one (A) or the triple + single one (B)?","sol":"A, [N=N=N]⁻: FCs −1, +1, −1 (all small). B, [N≡N–N]⁻: 0, +1, −2 (a −2 is worse). A contributes most; B and its mirror image (below) contribute less. <span class=\"lewis\" data-l=\"N3_c\"><\/span>","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"R1","mod":"res","kind":"num","ans":1.3333333333333333,"tol":0.02,"unit":"","stem":"What is the average C–O bond order in the carbonate ion, CO<sub>3<\/sub><sup>2−<\/sup>?","sol":"Three equivalent contributors, each with one C=O and two C–O. Total bonds = 4 over 3 positions → <b>4/3 ≈ 1.33<\/b>. <span class=\"lewis\" data-l=\"CO3_1\"><\/span> <span class=\"lewis\" data-l=\"CO3_2\"><\/span> <span class=\"lewis\" data-l=\"CO3_3\"><\/span>","sf":null,"diff":2,"tag":"","trap":""},{"id":"R2","mod":"res","kind":"num","ans":1.5,"tol":0.01,"stem":"What is the average N–O bond order in the nitrite ion, NO<sub>2<\/sub><sup>−<\/sup>?","sol":"Two equivalent contributors: O=N–O⁻ ↔ ⁻O–N=O. 3 bonds over 2 positions = <b>1.5<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"R3","mod":"res","kind":"num","ans":-0.6666666666666666,"tol":0.03,"stem":"What is the average formal charge on each oxygen in the nitrate ion, NO<sub>3<\/sub><sup>−<\/sup>?","sol":"In each contributor two O have −1 and one has 0: total −2 over 3 O → <b>−2/3 ≈ −0.67<\/b>. <span class=\"lewis\" data-l=\"NO3_h\"><\/span>","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"R4","mod":"res","kind":"mc","choices":["CH₃OH (single C–O)","CO","CO₂","CO<sub>3<\/sub><sup>2−<\/sup>"],"ans":0,"stem":"Which species has the <b>longest<\/b> C–O bond?","sol":"Bond orders: CO 3, CO₂ 2, CO₃²⁻ 1.33, CH₃OH 1. Lowest bond order → longest bond: <b>CH₃OH<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"R5","mod":"res","kind":"mc","choices":["Nitrate's contributors are equivalent; N₂O's are not","Both sets are equivalent","Neither set is equivalent","N₂O has no resonance"],"ans":0,"stem":"Compare the resonance contributors of NO<sub>3<\/sub><sup>−<\/sup> and of N₂O.","sol":"NO₃⁻'s three contributors are identical except for which O is double-bonded: equivalent, equal weight. N₂O's contributors have different FC patterns: inequivalent, unequal weight. <span class=\"lewis\" data-l=\"N2O_a\"><\/span> <span class=\"lewis\" data-l=\"N2O_b\"><\/span> <span class=\"lewis\" data-l=\"N2O_c\"><\/span>","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"R6","mod":"res","kind":"mc","choices":["Lone pairs and electrons in double/triple bonds","Atoms","Hydrogen atoms only","Single-bond electrons"],"ans":0,"stem":"Between resonance contributors, what is allowed to move?","sol":"Only electrons: lone pairs and π electrons (in double/triple bonds). Nuclei stay put. Moving an atom makes a different molecule (an isomer), not a resonance contributor.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"R7","mod":"res","kind":"num","ans":6,"tol":0.0,"stem":"Using the sulfate structure with two S=O double bonds, how many equivalent resonance contributors are there?","sol":"Choose which 2 of the 4 O atoms get double bonds: 4C2 = <b>6<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"R8","mod":"res","kind":"mc","choices":["The real ion is one blend of all contributors; it does not flip between them","The ion switches rapidly between the contributors","Only the first contributor drawn exists","Each contributor is a separate isomer"],"ans":0,"stem":"Which statement about a resonance structure is correct?","sol":"Course vocabulary: each drawing is a resonance <i>contributor<\/i>; together they describe the <i>resonance structure<\/i>, a single hybrid with delocalized electrons. Both O–O bonds in ozone are identical, between single and double.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"R9","mod":"res","kind":"num","ans":1.25,"tol":0.01,"stem":"With one P=O double bond in the best phosphate structure (PO<sub>4<\/sub><sup>3−<\/sup>), what is the average P–O bond order?","sol":"5 bonds over 4 positions = <b>1.25<\/b>. Average O formal charge = −3/4. <span class=\"lewis\" data-l=\"PO4_1d\"><\/span>","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"R10","mod":"res","kind":"mc","choices":["NO⁺","NO<sub>2<\/sub><sup>+<\/sup>","NO<sub>2<\/sub><sup>−<\/sup>","NO<sub>3<\/sub><sup>−<\/sup>"],"ans":0,"stem":"Which species has the shortest N–O bond?","sol":"Bond orders: NO⁺ 3 ([N≡O]⁺), NO₂⁺ 2 (O=N=O), NO₂⁻ 1.5, NO₃⁻ 1.33. Highest BO → <b>shortest<\/b>: NO⁺.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"R11","mod":"res","kind":"mc","choices":["C≡N &gt; C=N &gt; C–N","C–N &gt; C=N &gt; C≡N","All equal","C=N &gt; C≡N &gt; C–N"],"ans":0,"stem":"Rank the bond strengths of C–N, C=N, and C≡N.","sol":"More shared pairs → stronger and shorter. Triple &gt; double &gt; single.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"R12","mod":"res","kind":"num","ans":1.5,"tol":0.01,"stem":"What is the C–C bond order in benzene?","sol":"Two equivalent contributors alternate single and double bonds: 9 bonds over 6 positions = <b>1.5<\/b>. <span class=\"lewis\" data-l=\"benzene_1\"><\/span> <span class=\"lewis\" data-l=\"benzene_2\"><\/span> <span class=\"lewis\" data-l=\"benzene_h\"><\/span>","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"R13","mod":"res","kind":"mc","choices":["NO<sub>2<\/sub><sup>−<\/sup>","NO<sub>3<\/sub><sup>−<\/sup>","Equal"],"ans":1,"stem":"Which has the longer N–O bonds, NO<sub>2<\/sub><sup>−<\/sup> or NO<sub>3<\/sub><sup>−<\/sup>?","sol":"BO: NO₂⁻ 1.5, NO₃⁻ 1.33. Lower bond order → longer: <b>NO₃⁻<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"R14","mod":"res","kind":"self","stem":"On paper: draw all three resonance contributors of NO<sub>3<\/sub><sup>−<\/sup> with formal charges, then state the average N–O bond order and the average formal charge on O.","model":"<span class=\"lewis\" data-l=\"NO3_1\"><\/span> <span class=\"lewis\" data-l=\"NO3_2\"><\/span> <span class=\"lewis\" data-l=\"NO3_3\"><\/span> Each: N +1, double-bonded O 0, single-bonded O −1. Average BO = 4/3; average O FC = −2/3.","rubric":["24 valence e⁻; same atom positions in all three","Correct FCs (N +1, two O at −1) and brackets with − charge","BO 4/3 and average O FC −2/3"],"tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"O1","mod":"org","kind":"mc","choices":["C₆H₁₀","C₆H₁₂","C₆H₆","C₆H₈"],"ans":0,"stem":"What is the molecular formula of this compound (cyclohexene)? <span class=\"lewis\" data-l=\"cyclohexene\"><\/span>","sol":"6 C at the vertices. Each C needs 4 bonds: the two C=C carbons have 1 H each, the other four have 2 H → 2 + 8 = 10 H. <b>C₆H₁₀<\/b>. (Ring + double bond: 2n + 2 − 4 = 10.)","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"O2","mod":"org","kind":"mc","choices":["Ketone and alcohol","Aldehyde and ether","Ester","Carboxylic acid"],"ans":0,"stem":"Which functional groups are in this molecule? <span class=\"lewis\" data-l=\"org_ketol\"><\/span>","sol":"C=O between two carbons → ketone. O–H on a carbon that has no C=O → alcohol.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"O3","mod":"org","kind":"mc","choices":["Ester","Ether and ketone","Carboxylic acid","Aldehyde"],"ans":0,"stem":"Which functional group is in this molecule? <span class=\"lewis\" data-l=\"org_ester\"><\/span>","sol":"C(=O)–O–C is one functional group: an <b>ester<\/b>. Don't split it into a ketone plus an ether; an atom can only belong to one functional group.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"O4","mod":"org","kind":"mc","choices":["C₄H₈O₂","C₄H₁₀O₂","C₅H₁₀O₂","C₄H₆O₂"],"ans":0,"stem":"What is the molecular formula of this molecule? <span class=\"lewis\" data-l=\"org_etherald\"><\/span>","sol":"C: 4. H: CH₃ (3) + CH₂ (2) + CH₂ (2) + CHO (1) = 8. O: 2 → <b>C₄H₈O₂<\/b>. Same formula as the ketone/alcohol and the ester above: different functional groups, same atoms (isomers).","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"O5","mod":"org","kind":"mc","choices":["Amine and amide","Amine and ketone","Two amides","Nitrile and alcohol"],"ans":0,"stem":"Which functional groups are present? <span class=\"lewis\" data-l=\"org_amide_amine\"><\/span>","sol":"Left: N attached only to C and H (no C=O) → <b>amine<\/b>. Right: C(=O)–NH₂ → <b>amide<\/b> (not a ketone + amine).","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"O6","mod":"org","kind":"mc","choices":["Alkyne and nitrile","Alkene and amine","Two alkynes","Alkyne and amide"],"ans":0,"stem":"Which functional groups are present? <span class=\"lewis\" data-l=\"org_yne_nitrile\"><\/span>","sol":"C≡C → alkyne. C≡N → nitrile (note: nitrile is on the second table on the review sheet).","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"O7","mod":"org","kind":"num","ans":14,"tol":0.0,"stem":"How many hydrogen atoms are in this molecule (2-methylpentane)? <span class=\"lewis\" data-l=\"org_2mp\"><\/span>","sol":"6 C, all single bonds, no rings → alkane C<sub>n<\/sub>H<sub>2n+2<\/sub> = C₆H₁₄ → <b>14<\/b>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"O8","mod":"org","kind":"mc","choices":["C₄H₆","C₄H₈","C₄H₁₀","C₄H₄"],"ans":0,"stem":"Which formula could be a linear alkyne with one triple bond?","sol":"Alkyne C<sub>n<\/sub>H<sub>2n−2<\/sub>: n = 4 → <b>C₄H₆<\/b>. (C₄H₈ is an alkene; C₄H₁₀ an alkane.)","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"O9","mod":"org","kind":"mc","choices":["Aldehyde","Ketone","Ether","Ester"],"ans":0,"stem":"What functional group is in CH₃CH₂CHO?","sol":"CHO = C=O at the end of the chain with an H on the carbonyl carbon → <b>aldehyde<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"O10","mod":"org","kind":"mc","choices":["Ether","Alcohol","Ketone","Ester"],"ans":0,"stem":"What functional group is in CH₃OCH₂CH₃?","sol":"O bonded to two carbons, no C=O → <b>ether<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"O11","mod":"org","kind":"mc","choices":["Carboxylic acid","Ketone and alcohol","Ester","Aldehyde and alcohol"],"ans":0,"stem":"What functional group is in CH₃COOH?","sol":"C(=O)–OH is one group: <b>carboxylic acid<\/b>. Its OH is not an alcohol.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"O12","mod":"org","kind":"mc","choices":["Arene (aromatic ring) and aldehyde","Alkene and ketone","Arene and ketone","Alkene and aldehyde"],"ans":0,"stem":"Which functional groups are in benzaldehyde? <span class=\"lewis\" data-l=\"org_benzald\"><\/span>","sol":"Benzene ring → arene/aryl. C=O with an H at the end → aldehyde.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"O13","mod":"org","kind":"mc","choices":["Nitrile","Amine","Amide","Alkyne"],"ans":0,"stem":"What functional group is in CH₃CN?","sol":"CH₃–C≡N: carbon triple-bonded to nitrogen → <b>nitrile<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"M1","mod":"naming","kind":"mc","choices":["H₂CrO₄(aq)","H₂Cr₂O₇(aq)","HCrO₄(aq)","H₂CrO₃(aq)"],"ans":0,"stem":"What is the formula of chromic acid?","sol":"Chromate = CrO₄²⁻. '-ate' → '-ic acid'. Two H⁺ balance 2− → <b>H₂CrO₄(aq)<\/b>.","tag":"","tol":0.01,"sf":null,"unit":"","diff":2,"trap":""},{"id":"M2","mod":"naming","kind":"mc","choices":["Sodium hypochlorite","Sodium chlorite","Sodium chlorate","Sodium chloride oxide"],"ans":0,"stem":"Name NaClO.","sol":"ClO⁻ = hypochlorite (ClO₂⁻ chlorite, ClO₃⁻ chlorate, ClO₄⁻ perchlorate).","tag":"","tol":0.01,"sf":null,"unit":"","diff":2,"trap":""},{"id":"M3","mod":"naming","kind":"mc","choices":["Aluminum fluoride","Aluminum trifluoride","Monoaluminum trifluoride","Aluminum(III) fluoride"],"ans":0,"stem":"Name AlF₃.","sol":"Ionic (metal + nonmetal): NO prefixes. Al only forms Al³⁺, so no Roman numeral either. <b>Aluminum fluoride<\/b>.","tag":"","tol":0.01,"sf":null,"unit":"","diff":2,"trap":""},{"id":"M4","mod":"naming","kind":"mc","choices":["Nickel(III) sulfite tetrahydrate","Nickel(II) sulfate tetrahydrate","Nickel(III) sulfate tetrahydrate","Dinickel trisulfite tetrahydrate"],"ans":0,"stem":"Name Ni₂(SO₃)₃·4H₂O.","sol":"SO₃²⁻ = sulfite. Three sulfites = 6−, split over 2 Ni → Ni³⁺ → nickel(III). ·4H₂O = tetrahydrate.","tag":"","tol":0.01,"sf":null,"unit":"","diff":2,"trap":""},{"id":"M5","mod":"naming","kind":"mc","choices":["Ag₂HPO₄","AgHPO₄","Ag₃PO₄","AgH₂PO₄"],"ans":0,"stem":"What is the formula of silver monohydrogen phosphate?","sol":"Hydrogen phosphate = HPO₄²⁻. Silver = Ag⁺. Two Ag⁺ balance 2− → <b>Ag₂HPO₄<\/b>.","tag":"","tol":0.01,"sf":null,"unit":"","diff":2,"trap":""},{"id":"M6","mod":"naming","kind":"num","ans":3,"tol":0.0,"stem":"How many of these anions carry a 2− charge: sulfite, nitrite, carbonate, hypochlorite, sulfate, acetate?","sol":"2−: sulfite SO₃²⁻, carbonate CO₃²⁻, sulfate SO₄²⁻ → <b>3<\/b>. 1−: nitrite NO₂⁻, hypochlorite ClO⁻, acetate C₂H₃O₂⁻.","trap":"Miscounting the 2− ions is a common loss. These charges must be automatic.","tag":"","sf":null,"unit":"","diff":2},{"id":"M7","mod":"naming","kind":"num","ans":164.086,"tol":0.002,"unit":"g/mol","stem":"Calculate the molar mass of calcium nitrate, Ca(NO₃)₂, to two decimal places.","sol":"40.078 + 2(14.007) + 6(15.999) = 164.086 → <b>164.09 g/mol<\/b>. (With 2-decimal masses, 40.08 + 2(14.01) + 6(16.00) = 164.10; also accepted.)","sf":null,"diff":2,"tag":"","trap":""},{"id":"M8","mod":"naming","kind":"mc","choices":["Sulfurous acid","Sulfuric acid","Hydrosulfuric acid","Hydrogen sulfite"],"ans":0,"stem":"Name H₂SO₃(aq).","sol":"SO₃²⁻ is sulfite. '-ite' → '-ous acid' → <b>sulfurous acid<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"M9","mod":"naming","kind":"mc","choices":["Iron(III) sulfate","Iron(II) sulfate","Diiron trisulfate","Iron sulfite"],"ans":0,"stem":"Name Fe₂(SO₄)₃.","sol":"3 SO₄²⁻ = 6− over 2 Fe → Fe³⁺ → <b>iron(III) sulfate<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"M10","mod":"naming","kind":"mc","choices":["Tetraphosphorus decaoxide","Phosphorus oxide","Diphosphorus pentoxide","Tetraphosphorus pentoxide"],"ans":0,"stem":"Name P₄O₁₀.","sol":"Two nonmetals → molecular → prefixes: <b>tetraphosphorus decaoxide<\/b>. (P₂O₅ would be diphosphorus pentoxide.)","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"M11","mod":"naming","kind":"num","ans":3,"tol":0.0,"stem":"What is the charge magnitude on the phosphate ion (enter the number only, e.g. 3 for 3−)?","sol":"Phosphate = PO₄<sup>3−<\/sup>.","sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"M12","mod":"naming","kind":"mc","choices":["Hydrofluoric acid","Fluoric acid","Hydrogen fluoride acid","Fluorous acid"],"ans":0,"stem":"Name HF(aq).","sol":"Binary acid (no oxygen): hydro- + root + -ic acid → <b>hydrofluoric acid<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"","trap":""},{"id":"S1","mod":"light","kind":"num","ans":3.0281628048780483e-19,"sf":3,"unit":"J","diff":1,"stem":"Precision drill: give the energy of one 656 nm photon to exactly <b>3<\/b> significant figures, in scientific notation (e.g. 1.23 × 10<sup>−19<\/sup>).","sol":"E = hc/λ = 3.028 × 10<sup>−19<\/sup> J → <b>3.03 × 10<sup>−19<\/sup> J<\/b>. Typing 3.0 × 10<sup>−19<\/sup> or 3.028 × 10<sup>−19<\/sup> is a sig-fig loss on this exam.","tol":0.01,"tag":"","trap":""},{"id":"S2","mod":"light","kind":"num","ans":1.9864748e-19,"sf":3,"unit":"J","diff":1,"stem":"Precision drill: the energy of a photon with λ = 1.00 μm, to 3 significant figures.","sol":"1.00 μm = 1.00 × 10<sup>−6<\/sup> m. E = hc/λ = <b>1.99 × 10<sup>−19<\/sup> J<\/b>.","tol":0.01,"tag":"","trap":""},{"id":"X1","mod":"config","kind":"mc","choices":["(4, 2, −2, +½)","(5, 0, 0, −½)","(5, 1, 0, +½)","(4, 2, 3, +½)","(5, 0, 1, +½)","(4, 0, 0, −½)"],"ans":1,"stem":"An electron is removed from a neutral silver atom to make Ag⁺. Which set of quantum numbers (n, ℓ, m<sub>ℓ<\/sub>, m<sub>s<\/sub>) could describe the removed electron?","sol":"Ag is an exception: [Kr]5s<sup>1<\/sup> 4d<sup>10<\/sup>. Cations lose the highest-n electron first, the lone 5s electron → n = 5, ℓ = 0, m<sub>ℓ<\/sub> = 0. Only (5, 0, 0, −½) fits. (4, 2, 3, …) and (5, 0, 1, …) are impossible sets.","trap":"Two traps stack here: knowing Ag is an exception (5s¹, not 5s²) and that ns leaves before (n−1)d.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"twin"},{"id":"X2","mod":"config","kind":"mc","choices":["Diamagnetic → paramagnetic","Paramagnetic → diamagnetic","No change: stays diamagnetic","No change: stays paramagnetic","Not enough information"],"ans":1,"stem":"An oxygen atom gains two electrons to form O²⁻. What happens to its magnetism?","sol":"O: 2p⁴ → one paired p orbital and two unpaired electrons → paramagnetic. O²⁻: 2p⁶ → all paired → diamagnetic.","tol":0.01,"sf":null,"unit":"","diff":2,"trap":"","tag":"twin"},{"id":"X3","mod":"config","kind":"mc","choices":["Diamagnetic → paramagnetic","Paramagnetic → diamagnetic","No change: stays diamagnetic","No change: stays paramagnetic","Not enough information"],"ans":3,"stem":"Iron loses three electrons to form Fe³⁺. What happens to its magnetism?","sol":"Fe [Ar]4s<sup>2<\/sup> 3d<sup>6<\/sup>: 4 unpaired → paramagnetic. Fe³⁺ [Ar]3d<sup>5<\/sup>: 5 unpaired → still paramagnetic.","tol":0.01,"sf":null,"unit":"","diff":2,"trap":"","tag":"twin"},{"id":"X4","mod":"qn","kind":"mc","choices":["(3, 2, −2, −½)","(3, 2, +1, +½)","(3, 2, +1, −½)","(3, 3, 0, +½)","(3, 2, +3, +½)"],"ans":1,"stem":"A 3d sublevel holds three electrons in m<sub>ℓ<\/sub> = −2, −1 and 0, all with m<sub>s<\/sub> = +½. A fourth electron is added (ground state). Which set could describe it?","sol":"Hund's rule: fill each orbital singly with parallel spins before pairing. The next electron goes into an empty orbital (m<sub>ℓ<\/sub> = +1 or +2) with the same spin (+½). (3, 3, …) and m<sub>ℓ<\/sub> = +3 are impossible.","trap":"Pairing up (−2, −½) or flipping the spin breaks Hund's rule in the ground state.","tol":0.01,"sf":null,"unit":"","diff":2,"tag":"twin"},{"id":"X5","mod":"config","kind":"mc","choices":["[Xe]","[Xe]6s²","[Xe]4f¹⁴5d¹⁰","[Xe]6s²4f¹⁴5d¹⁰","[Xe]5f¹⁴5d¹⁰"],"ans":2,"stem":"Using the course definition, which correctly represents the <b>core<\/b> electrons of lead (Pb)?","sol":"Pb = [Xe]6s<sup>2<\/sup> 4f<sup>14<\/sup> 5d<sup>10<\/sup> 6p<sup>2<\/sup>. Core = filled shells + filled d/f sublevels = [Xe]4f¹⁴5d¹⁰ (78 electrons). Valence = 6s²6p² (4). 5f doesn't fill before 6p.","tol":0.01,"sf":null,"unit":"","diff":2,"trap":"","tag":"twin"},{"id":"X6","mod":"config","kind":"self","stem":"On paper: write noble-gas configurations for <b>Ni<\/b> and <b>As<\/b>, and give the number of valence electrons for each (course definition). Then write Ni²⁺.","model":"Ni [Ar]4s<sup>2<\/sup> 3d<sup>8<\/sup>: valence = 4s² + unfilled 3d⁸ = 10. As [Ar]4s<sup>2<\/sup> 3d<sup>10<\/sup> 4p<sup>3<\/sup>: the full 3d¹⁰ is core, valence = 4s²4p³ = 5. Ni²⁺ = [Ar]3d<sup>8<\/sup> (4s leaves first).","rubric":["Ni configuration with 4s²3d⁸","Ni valence = 10 (unfilled d counts)","As valence = 5 (filled d is core)","Ni²⁺ = [Ar]3d⁸"],"tol":0.01,"sf":null,"unit":"","diff":2,"trap":"","tag":"twin"},{"id":"X7","mod":"qn","kind":"num","ans":6,"tol":0.0,"stem":"How many different sublevels are in the n = 6 shell?","sol":"One per ℓ value: ℓ = 0…5 → <b>6<\/b> (6s, 6p, 6d, 6f, 6g, 6h).","sf":null,"unit":"","diff":2,"trap":"","tag":"twin"},{"id":"X8","mod":"qn","kind":"num","ans":5,"tol":0.0,"stem":"A sublevel contains 11 degenerate orbitals. What is ℓ?","sol":"Orbitals per sublevel = 2ℓ + 1 = 11 → ℓ = <b>5<\/b> (an h sublevel).","sf":null,"unit":"","diff":2,"trap":"","tag":"twin"},{"id":"X9","mod":"qn","kind":"num","ans":14,"tol":0.0,"stem":"What is the maximum number of electrons in the n = 5, ℓ = 3 sublevel?","sol":"ℓ = 3 → 7 orbitals × 2 = <b>14<\/b> (5f).","sf":null,"unit":"","diff":2,"trap":"","tag":"twin"},{"id":"X10","mod":"qm","kind":"multi","choices":["3d","5p","6f","2s","4s"],"ans":[1,2,4],"stem":"Which of these subshells have orbitals with <b>at least two radial nodes<\/b>? Select all.","sol":"Radial nodes = n − ℓ − 1: 3d → 0, 5p → 3, 6f → 2, 2s → 1, 4s → 3. At least two: <b>5p, 6f, 4s<\/b>.","tol":0.01,"sf":null,"unit":"","diff":2,"trap":"","tag":"twin"},{"id":"X11","mod":"config","kind":"mc","choices":["4p ‹ 5s ‹ 4d ‹ 6s ‹ 4f","4p ‹ 4d ‹ 4f ‹ 5s ‹ 6s","5s ‹ 4p ‹ 6s ‹ 4d ‹ 4f","4p ‹ 5s ‹ 6s ‹ 4d ‹ 4f"],"ans":0,"stem":"Using the Aufbau filling order, arrange these sublevels from lowest to highest energy: 4f, 6s, 4p, 4d, 5s.","sol":"Follow the periodic table (or n + ℓ, lower n first on ties): 4p (5) ‹ 5s (5) ‹ 4d (6) ‹ 6s (6) ‹ 4f (7).","tol":0.01,"sf":null,"unit":"","diff":2,"trap":"","tag":"twin"},{"id":"X12","mod":"qn","kind":"mc","choices":["Hund's rule","The Pauli exclusion principle","The Aufbau principle","Heisenberg's uncertainty principle"],"ans":0,"stem":"Which rule describes how electrons spread out within a single sublevel (one per orbital, parallel spins) before pairing?","sol":"<b>Hund's rule<\/b>. Aufbau = which sublevel fills first; Pauli = at most two electrons per orbital, opposite spins.","tol":0.01,"sf":null,"unit":"","diff":2,"trap":"","tag":"twin"},{"id":"X13","mod":"qm","kind":"multi","choices":["It can hold at most 2 electrons","It can hold up to 6 electrons","The electron moves along a figure-eight path around the lobes","We can't know the electron's exact position at a given instant","It has one angular node","It has two radial nodes","An electron in the + lobe has more energy than one in the − lobe"],"ans":[0,3,4],"stem":"Which statements about a <b>single 3p orbital<\/b> are true? Select all.","sol":"Any one orbital holds 2 electrons (a whole p subshell holds 6). An orbital is a probability region; electrons don't trace paths, and Heisenberg means the exact position is unknowable. p: ℓ = 1 → 1 angular node; radial = 3 − 1 − 1 = 1 (not 2). The + and − signs are the phase of ψ, not energy.","tol":0.01,"sf":null,"unit":"","diff":2,"trap":"","tag":"twin"},{"id":"X14","mod":"qm","kind":"mc","choices":["A is 1s, B is 2s, C is 3s","A is 2s, B is 1s, C is 3s","A is 3s, B is 1s, C is 2s","A is 2s, B is 3s, C is 1s"],"ans":1,"stem":"<svg class=\"fig\" viewBox=\"0 0 520 330\" role=\"img\" aria-label=\"Radial probability distributions for three s orbitals, panels A, B and C\"><polyline class=\"fcurve\" points=\"40.0,90.0 41.2,89.5 42.3,88.2 43.5,86.3 44.7,84.2 45.9,81.9 47.0,79.7 48.2,77.6 49.4,75.7 50.5,74.1 51.7,72.7 52.9,71.7 54.0,70.9 55.2,70.5 56.4,70.4 57.5,70.6 58.7,71.0 59.9,71.7 61.1,72.5 62.2,73.5 63.4,74.6 64.6,75.9 65.7,77.2 66.9,78.5 68.1,79.9 69.2,81.2 70.4,82.5 71.6,83.8 72.8,84.9 73.9,86.0 75.1,87.0 76.3,87.8 77.4,88.6 78.6,89.1 79.8,89.6 81.0,89.9 82.1,90.0 83.3,90.0 84.5,89.8 85.6,89.5 86.8,89.0 88.0,88.4 89.1,87.6 90.3,86.7 91.5,85.7 92.7,84.5 93.8,83.2 95.0,81.9 96.2,80.4 97.3,78.8 98.5,77.2 99.7,75.5 100.8,73.7 102.0,71.8 103.2,69.9 104.3,68.0 105.5,66.0 106.7,64.0 107.9,62.0 109.0,60.0 110.2,58.0 111.4,56.0 112.5,54.0 113.7,52.0 114.9,50.1 116.0,48.1 117.2,46.2 118.4,44.4 119.6,42.6 120.7,40.8 121.9,39.1 123.1,37.5 124.2,35.9 125.4,34.3 126.6,32.9 127.8,31.5 1
